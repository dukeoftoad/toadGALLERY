name: toad-setup
description: >-
  The canonical toadGALLERY CI toolchain setup (F-2, follow-up
  2026-11-04): Rust (host gates / Android cross) + JDK 17 + Android SDK
  (platform 36, build-tools 36) + the Gradle/cargo caches. The setup
  blocks that ci.yml, engine-apk.yml, modelpack-apk.yml,
  apk-build-engine.yml and editor-apk-build.yml previously replicated
  verbatim; this action is their single source now. The CHECKOUT step
  stays in each workflow (fail-fast guards must run around it, and
  checkout is not setup).

inputs:
  rust:
    description: >-
      Rust mode: '' (default) = no Rust toolchain at all (the pure
      Android jobs); 'host' = stable + rustfmt + clippy + the HOST cargo
      cache (the engine cargo check/fmt/clippy gates); 'android' =
      stable + the aarch64-linux-android target + the ANDROID cargo
      cache + cargo-ndk (pinned 3.5.4) + the preinstalled-NDK resolve
      (the engine-enabled cross builds).
    default: ''
  android:
    description: >-
      Whether to set up the Android side: JDK 17 (temurin, gradle cache),
      the pinned SDK packages, the Gradle cache and the gradlew chmod.
      A string input ('true'/'false') --- composite-action inputs are
      strings on every runner version; pass android: false to skip.
    default: 'true'

runs:
  using: composite
  steps:

    # ---- Rust, host mode: the engine's cargo check/fmt/clippy/test gates ----
    - name: Set up Rust (stable, rustfmt + clippy)
      if: ${{ inputs.rust == 'host' }}
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo (host)
      if: ${{ inputs.rust == 'host' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          engine/target
        key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-

    # ---- Rust, android mode: the engine-enabled cross builds ----
    - name: Set up Rust (stable, aarch64-linux-android)
      if: ${{ inputs.rust == 'android' }}
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Cache cargo (android)
      if: ${{ inputs.rust == 'android' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          engine/target
        key: cargo-android-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
        restore-keys: cargo-android-${{ runner.os }}-

    # Cache the cargo-ndk BINARY alone so `cargo install` is skipped
    # entirely on hit (the command -v guard below makes the install a
    # no-op, so no ~/.cargo/.crates* metadata needs caching).
    - name: Cache cargo-ndk
      if: ${{ inputs.rust == 'android' }}
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-ndk
        key: cargo-ndk-${{ runner.os }}-3.5.4

    - name: Install cargo-ndk (pinned)
      if: ${{ inputs.rust == 'android' }}
      shell: bash
      run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --version 3.5.4 --locked

    # GH ubuntu runners ship preinstalled NDKs under $ANDROID_HOME/ndk/;
    # pick the newest and export it. (engine/scripts/build-android.sh would
    # discover it itself; resolving here documents the choice in the log.
    # If the image ever drops NDKs, the script's sdkmanager fallback
    # installs the pinned one instead --- java is set up below.)
    - name: Resolve the preinstalled Android NDK
      if: ${{ inputs.rust == 'android' }}
      shell: bash
      run: |
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        NDK_HOME="$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)"
        if [ -z "$NDK_HOME" ]; then
          echo "No preinstalled NDK under $SDK_ROOT/ndk --- the build script's sdkmanager fallback will install one."
        else
          echo "Using preinstalled NDK: $NDK_HOME"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
        fi

    # ---- Android: JDK + the pinned SDK packages + the Gradle cache ----
    - name: Set up JDK 17
      if: ${{ inputs.android == 'true' }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    # GH ubuntu runners ship a preinstalled Android SDK at $ANDROID_HOME
    # (cmdline-tools included) but do not always put sdkmanager on PATH, and
    # android-actions/setup-android@v3 is broken on current images (it runs the
    # legacy `sdkmanager tools` package, which no longer exists). Resolve the
    # binary directly and install only what the project pins.
    - name: Install Android SDK packages (platform 36, build-tools 36)
      if: ${{ inputs.android == 'true' }}
      shell: bash
      run: |
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        if command -v sdkmanager >/dev/null 2>&1; then
          SDK_MGR="$(command -v sdkmanager)"
        else
          SDK_MGR="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -1)"
        fi
        echo "Using sdkmanager: $SDK_MGR"
        yes | "$SDK_MGR" --licenses > /dev/null || true
        "$SDK_MGR" --install "platforms;android-36" "build-tools;36.0.0"
        "$SDK_MGR" --list_installed | grep -E "platforms;android-36|build-tools;36" || true

    - name: Cache Gradle
      if: ${{ inputs.android == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Grant execute permission for gradlew
      if: ${{ inputs.android == 'true' }}
      shell: bash
      run: chmod +x ./gradlew
