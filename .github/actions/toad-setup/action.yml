name: toad-setup
description: >-
  The canonical toadGALLERY CI toolchain setup: JDK 17 + Android SDK
  (platform 36, build-tools 36) + the Gradle cache + the gradlew chmod.
  The setup blocks that ci.yml and editor-ci.yml previously replicated
  verbatim; this action is their single source now. The CHECKOUT step
  stays in each workflow (fail-fast guards must run around it, and
  checkout is not setup).

runs:
  using: composite
  steps:

    # Validate the committed wrapper BEFORE any gradle use in the job:
    # gradle/wrapper-validation-action fails the build unless every
    # gradle-wrapper.jar is the genuine artifact of a Gradle distribution.
    # Together with distributionSha256Sum in the wrapper properties (the
    # distribution zip is checksum-verified at download time), a tampered
    # wrapper fails closed in every build, including the release pipeline
    # that holds the signing secrets.
    - name: Validate the Gradle wrapper
      uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    # GH ubuntu runners ship a preinstalled Android SDK at $ANDROID_HOME
    # (cmdline-tools included) but do not always put sdkmanager on PATH, and
    # android-actions/setup-android@v3 is broken on current images (it runs the
    # legacy `sdkmanager tools` package, which no longer exists). Resolve the
    # binary directly and install only what the project pins.
    - name: Install Android SDK packages (platform 36, build-tools 36)
      shell: bash
      run: |
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        if command -v sdkmanager >/dev/null 2>&1; then
          SDK_MGR="$(command -v sdkmanager)"
        else
          SDK_MGR="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -1)"
        fi
        echo "Using sdkmanager: $SDK_MGR"
        yes | "$SDK_MGR" --licenses > /dev/null || true
        "$SDK_MGR" --install "platforms;android-36" "build-tools;36.0.0"
        "$SDK_MGR" --list_installed | grep -E "platforms;android-36|build-tools;36" || true

    - name: Cache Gradle
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x ./gradlew
