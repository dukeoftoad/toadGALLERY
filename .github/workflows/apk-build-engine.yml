name: APK build with engine

# toadGALLERY --- the generalized, dispatch-only engine-enabled APK build
# (2026-11-04 workplan window, docs/workplan.md P4).
#
# What this is: an opt-in builder for the :apps:gallery APK with the vendored
# Ente engine packaged (-PwithEngine: cargo-ndk libtoad_ml_jni.so + the
# sha256-pinned ORT 1.31.0 libonnxruntime.so, arm64-v8a --- the same chain
# ci.yml's engine-android job and engine-apk.yml use, byte-for-byte the same
# pins and cache keys, so main's warm caches apply).
#
# Delta vs the existing engine-apk.yml (complement, NOT a duplicate):
#   - ref-agnostic (engine-apk.yml is the branch-scoped tg-engine-apk-*
#     test-build pipeline with the round-convention staging),
#   - input-driven: build_variant + engine_version (validated against the
#     pin --- the engine is VENDORED into this repo at the commit recorded
#     in docs/phase-5/ente-pin.md and cannot be swapped by dispatch input),
#   - uploads the R8 mapping.txt alongside the APK and the build log on
#     failure, and renders a job summary.
#
# Signing (ADR-0018): release.yml stays the ONLY signing release path. The
# debug variant (the default) uses the debug key like every other test
# build. A release-variant dispatch reuses the exact TG_* env contract from
# release.yml and FAILS FAST on missing secrets. No tag is cut and no GitHub
# Release is created by this workflow, ever.
#
# Reuse policy (F-2 delivered, 2026-11-04): the toolchain setup now lives
# in .github/actions/toad-setup (this workflow's original "replicated
# verbatim" note spawned that extraction); the setup call below carries the
# same pins and cache keys the verbatim blocks had --- main's warm caches
# restore here unchanged.
#
# Triggers: workflow_dispatch ONLY --- ci.yml already gates PRs/main and
# release.yml owns v* tags (the repo's existing trigger pattern).

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant. debug = debug-key artifact (default). release = signed via the ADR-0018 TG_* secrets (fail-fast if missing).'
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true
      engine_version:
        description: 'Engine version: keep "pinned" (vendored pin in docs/phase-5/ente-pin.md). A commit sha matching the pin is also accepted; anything else fail-fasts.'
        type: string
        default: pinned
        required: true

concurrency:
  group: apk-build-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-apk:
    name: Engine-enabled APK (arm64-v8a) + artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_VARIANT: ${{ github.event.inputs.build_variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail fast — the vendored engine workspace must be present
        run: |
          missing=0
          for f in engine/Cargo.toml engine/scripts/build-android.sh docs/phase-5/ente-pin.md; do
            if [ ! -f "$f" ]; then
              echo "::error::required engine file '$f' is missing --- the vendored Ente engine workstream is not in this checkout. Restore it before dispatching 'APK build with engine'."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Fail fast — validate the engine_version input against the pin
        run: |
          VERSION_INPUT="${{ github.event.inputs.engine_version }}"
          if [ "$VERSION_INPUT" = "pinned" ]; then
            echo "engine_version: pinned (the vendored pin in docs/phase-5/ente-pin.md)"
            exit 0
          fi
          PINNED="$(grep -m1 -oE '[0-9a-f]{40}' docs/phase-5/ente-pin.md || true)"
          if [ -z "$PINNED" ]; then
            echo "::error::could not read the pinned engine commit from docs/phase-5/ente-pin.md"
            exit 1
          fi
          case "$VERSION_INPUT" in
            "$PINNED"|"${PINNED:0:8}")
              echo "engine_version matches the pin: $PINNED" ;;
            *)
              echo "::error::engine_version '$VERSION_INPUT' does not match the vendored pin ($PINNED). The engine is VENDORED into this repo at the pin recorded in docs/phase-5/ente-pin.md and cannot be swapped by a dispatch input --- move the pin via that document's regeneration procedure instead."
              exit 1 ;;
          esac

      - name: Fail fast — release variant requires the ADR-0018 signing secrets
        if: env.BUILD_VARIANT == 'release'
        env:
          TG_RELEASE_KEYSTORE_BASE64: ${{ secrets.TG_RELEASE_KEYSTORE_BASE64 }}
          TG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          TG_RELEASE_KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          TG_RELEASE_KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$TG_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::required secret 'TG_RELEASE_KEYSTORE_BASE64' is not set --- release-variant builds sign with the ADR-0018 release key. Add it under Settings > Secrets and variables > Actions, or dispatch the debug variant instead."
          fi
          if [ -z "$TG_RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::required secret 'TG_RELEASE_KEYSTORE_PASSWORD' is not set (ADR-0018 release signing contract)."
          fi
          if [ -z "$TG_RELEASE_KEY_ALIAS" ]; then
            echo "::error::required secret 'TG_RELEASE_KEY_ALIAS' is not set (ADR-0018 release signing contract)."
          fi
          if [ -z "$TG_RELEASE_KEY_PASSWORD" ]; then
            echo "::error::required secret 'TG_RELEASE_KEY_PASSWORD' is not set (ADR-0018 release signing contract)."
          fi
          if [ -z "$TG_RELEASE_KEYSTORE_BASE64" ] || [ -z "$TG_RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$TG_RELEASE_KEY_ALIAS" ] || [ -z "$TG_RELEASE_KEY_PASSWORD" ]; then
            exit 1
          fi

      # F-2 (follow-up 2026-11-04): the canonical toolchain setup now lives
      # in .github/actions/toad-setup --- the full engine-cross shape (Rust
      # + aarch64 target + the android cargo cache + cargo-ndk + the NDK
      # resolve + the whole Android side), same pins, same cache keys (the
      # warm caches from main's CI restore here unchanged).
      - name: Set up the toolchain (Rust Android cross + Android)
        uses: ./.github/actions/toad-setup
        with:
          rust: android

      # ADR-0018 contract, mirrored verbatim from release.yml: the Gradle
      # signingConfig reads exactly these four TG_* env vars. Debug dispatches
      # skip both steps entirely (debug key, like every other test build).
      - name: Decode release keystore (release variant only)
        if: env.BUILD_VARIANT == 'release'
        run: |
          echo "${{ secrets.TG_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/toadgallery-release.jks"
          chmod 600 "$RUNNER_TEMP/toadgallery-release.jks"
          if [ ! -s "$RUNNER_TEMP/toadgallery-release.jks" ]; then
            echo "::error::decoded keystore is empty --- is TG_RELEASE_KEYSTORE_BASE64 set (ADR-0018)?"
            exit 1
          fi

      - name: Export signing environment for Gradle (release variant only)
        if: env.BUILD_VARIANT == 'release'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          TG_KEYSTORE_FILE=$RUNNER_TEMP/toadgallery-release.jks
          TG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          TG_KEY_ALIAS=$KEY_ALIAS
          TG_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      # -PwithEngine registers the buildRustEngine Exec task (preBuild
      # dependency): cargo-ndk builds libtoad_ml_jni.so + stages the
      # sha256-pinned libonnxruntime.so for arm64-v8a into
      # apps/gallery/build/rust-jniLibs/. tee + pipefail keeps the exit code
      # while persisting the full log for the on-failure upload below.
      - name: Assemble (${{ env.BUILD_VARIANT }}) with the vendored engine
        run: |
          set -o pipefail
          if [ "$BUILD_VARIANT" = "release" ]; then
            TASK=":apps:gallery:assembleRelease"
          else
            TASK=":apps:gallery:assembleDebug"
          fi
          echo "task: $TASK -PwithEngine"
          ./gradlew "$TASK" -PwithEngine --no-daemon --stacktrace 2>&1 | tee build-output.log

      # Gate (verbatim shape from ci.yml engine-android / engine-apk.yml):
      # the engine-enabled APK must carry BOTH native libraries.
      - name: Verify the native libraries are packaged
        run: |
          APK="$(ls "apps/gallery/build/outputs/apk/$BUILD_VARIANT/"*.apk)"
          echo "APK: $APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libtoad_ml_jni.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libonnxruntime.so"

      # Gate: pin the APK identity --- the variant-correct application id and
      # the versionCode DERIVED from the checkout's own build.gradle.kts
      # (the engine-apk.yml generalized-derivation pattern).
      - name: Verify APK identity (package + the checkout's versionCode)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)"
          if [ -z "$AAPT2" ]; then echo "::error::aapt2 not found under $SDK_ROOT/build-tools"; exit 1; fi
          APK="$(ls "apps/gallery/build/outputs/apk/$BUILD_VARIANT/"*.apk)"
          EXPECTED_VC="$(grep -m1 -oE 'versionCode = [0-9]+' apps/gallery/build.gradle.kts | grep -oE '[0-9]+' | head -1)"
          if [ -z "$EXPECTED_VC" ]; then echo "::error::could not derive versionCode from apps/gallery/build.gradle.kts"; exit 1; fi
          if [ "$BUILD_VARIANT" = "release" ]; then
            EXPECTED_ID="io.github.dukeoftoad.gallery"
          else
            EXPECTED_ID="io.github.dukeoftoad.gallery.debug"
          fi
          BADGE="$("$AAPT2" dump badging "$APK" | head -1)"
          echo "badging: $BADGE"
          echo "derived expected versionCode: $EXPECTED_VC / expected id: $EXPECTED_ID"
          echo "$BADGE" | grep -q "name='$EXPECTED_ID'" \
            || { echo "::error::unexpected application id (expected $EXPECTED_ID for the $BUILD_VARIANT variant)"; exit 1; }
          echo "$BADGE" | grep -q "versionCode='$EXPECTED_VC'" \
            || { echo "::error::unexpected versionCode (expected $EXPECTED_VC, derived from the checkout)"; exit 1; }

      - name: Stage the APK + R8 mapping
        run: |
          APK="$(ls "apps/gallery/build/outputs/apk/$BUILD_VARIANT/"*.apk)"
          VERSION_NAME="$(grep -m1 -oE 'versionName = "[^"]+"' apps/gallery/build.gradle.kts | sed -e 's/versionName = //' -e 's/"//g')"
          if [ -z "$VERSION_NAME" ]; then echo '::error::could not derive versionName'; exit 1; fi
          STAGE="$RUNNER_TEMP/apk-staging"
          mkdir -p "$STAGE"
          APK_NAME="toadGALLERY-${VERSION_NAME}-engine-${BUILD_VARIANT}.apk"
          cp "$APK" "$STAGE/$APK_NAME"
          ( cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          if [ -f "apps/gallery/build/outputs/mapping/$BUILD_VARIANT/mapping.txt" ]; then
            cp "apps/gallery/build/outputs/mapping/$BUILD_VARIANT/mapping.txt" "$STAGE/"
          else
            echo "::warning::no R8 mapping at apps/gallery/build/outputs/mapping/$BUILD_VARIANT/mapping.txt (debug builds are not minified --- expected; release builds MUST produce one)"
          fi
          ls -la "$STAGE"
          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "APK_NAME=$APK_NAME"
          } >> "$GITHUB_ENV"

      - name: Upload APK + mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: toadGALLERY-${{ env.VERSION_NAME }}-engine-${{ env.BUILD_VARIANT }}
          path: ${{ runner.temp }}/apk-staging/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-engine-logs-${{ github.run_id }}
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: always()
        env:
          VARIANT: ${{ env.BUILD_VARIANT }}
        run: |
          SIGNING="debug key (test build, not a release)"
          if [ "${VARIANT:-debug}" = "release" ]; then
            SIGNING="ADR-0018 release key (TG_* secrets)"
          fi
          {
            echo "## APK build with engine"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Variant | \`${VARIANT:-unknown}\` |"
            echo "| Engine | vendored pin (docs/phase-5/ente-pin.md) |"
            echo "| versionName | \`${VERSION_NAME:-not reached}\` |"
            echo "| APK artifact | \`toadGALLERY-${VERSION_NAME:-?}-engine-${VARIANT:-?}\` |"
            echo "| Signing | $SIGNING |"
            echo ""
            echo "Engine chain: cargo-ndk arm64-v8a -> libtoad_ml_jni.so + sha256-pinned libonnxruntime.so (ORT 1.31.0) -> -PwithEngine packaging; both .so files verified inside the APK."
            echo ""
            echo "NOT a release: no tag was cut and no GitHub Release was created (release.yml stays the only signing release path, ADR-0018)."
          } >> "$GITHUB_STEP_SUMMARY"
