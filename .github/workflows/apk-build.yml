name: APK builds (test artifacts)

# toadGALLERY --- the CONSOLIDATED test-APK builder (r49, the workflow-
# organization round). ONE file replaces FOUR near-duplicate pipelines:
#
#   - apk-build-engine.yml  ("APK build with engine", the 2026-11-04
#     workplan P4 generalized builder)  -> target: gallery-engine
#   - engine-apk.yml        (the 2026-11-03 branch-scoped tg-engine-apk-*
#     test-build pipeline)              -> trigger: push to tg-engine-apk-*
#   - modelpack-apk.yml     (the ADR-0020 offline model-pack builder)
#                                         -> target: gallery-modelpack
#                                           (+ trigger: tg-modelpack-*)
#   - editor-apk-build.yml  ("Editor APK build --- include all")
#                                         -> target: editor
#
# What the consolidation CHANGES (and what it deliberately does not):
#   - The engine-enabled build chain (toad-setup rust:android ->
#     assembleEngine<Variant> -PwithEngine -> the native-library gate ->
#     the identity gate -> staging -> artifact) was previously written
#     out three times with drift between the copies: modelpack-apk.yml
#     staged under a HARDCODED r28 name (toadGALLERY-0.4.2-alpha-r28-...)
#     and gated versionCode >= 32 while the checkout moved to 38+, and
#     the branch-scoped file carried its own round-comment staging
#     convention. All gallery targets now stage under the checkout's own
#     derived versionName (toadGALLERY-<versionName>-<target>-engine-
#     <variant>.apk) and gate the EXACT derived versionCode --- one
#     derivation rule, one identity gate, no hardcode to rot.
#   - The branch-scoped push triggers survive (tg-engine-apk-* and
#     tg-modelpack-*): the isolated-work-session convention --- a dogfood
#     branch that touches no shared file still builds its artifact on
#     push. The target is INFERRED from the branch name; anything else
#     fail-fasts with the fix in the message.
#   - The editor keeps its cheap pure-Android shape (no Rust/NDK --- the
#     editor is pure Kotlin) in its own job; the gallery keeps the full
#     engine-cross shape in its own job. One trigger surface, two
#     toolchain budgets.
#   - Least-privilege: `permissions: contents: read` at the top --- this
#     workflow uploads artifacts and never touches releases (the ADR-0018
#     contract: release.yml stays the ONLY signing/publishing path; no
#     tag is cut and no GitHub Release is created here, ever).
#
# Version derivation (the documented split, mirrored from release.yml):
# the GALLERY gradle keeps history as COMMENTED pairs with one live
# assignment (first match is the live one); the EDITOR gradle appends
# LIVE pairs per round and the LAST assignment wins (the r43 catch in
# the editor leg below). Each derivation uses the rule its file needs;
# the gates verify the derived values against the actual APK via aapt2.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build. gallery-engine = the engine-enabled gallery APK (the vendored Ente engine, -PwithEngine). gallery-modelpack = the same + the sha256-verified offline FACE model pack (-PwithBundledModels, debug only). editor = all editor targets (debug APK / unsigned release gate / the shared contract module).'
        type: choice
        options:
          - gallery-engine
          - gallery-modelpack
          - editor
        default: gallery-engine
        required: true
      gallery_variant:
        description: 'Gallery variant (gallery-engine target only): debug = debug-key artifact (default). release = signed via the ADR-0018 TG_* secrets (fail-fast if missing). The model-pack target forces debug (a dogfood build, not a release).'
        type: choice
        options:
          - debug
          - release
        default: debug
        required: false
      editor_variant:
        description: 'Editor targets (editor target only): all = debug + release + contract (default). The contract leg always runs.'
        type: choice
        options:
          - all
          - debug
          - release
        default: all
        required: false
      engine_version:
        description: 'Gallery targets only: keep "pinned" (the vendored pin in docs/phase-5/ente-pin.md). A commit sha matching the pin is also accepted; anything else fail-fasts (the engine is VENDORED, not swappable).'
        type: string
        default: pinned
        required: false
  push:
    branches:
      - 'tg-engine-apk-*'
      - 'tg-modelpack-*'

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Prepare: resolve ONE target + its variants from the event (dispatch inputs
  # or the branch-scoped push convention), so the two build jobs below stay
  # declarative. Everything unknown fail-fasts here, before any runner spends
  # toolchain minutes.
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve the build target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      gallery_variant: ${{ steps.resolve.outputs.gallery_variant }}
      editor_variant: ${{ steps.resolve.outputs.editor_variant }}
      gallery_run: ${{ steps.resolve.outputs.gallery_run }}
      editor_run: ${{ steps.resolve.outputs.editor_run }}
      editor_targets: ${{ steps.resolve.outputs.editor_targets }}
    steps:
      - name: Resolve target + variants from the event
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ inputs.target }}
          DISPATCH_GALLERY_VARIANT: ${{ inputs.gallery_variant }}
          DISPATCH_EDITOR_VARIANT: ${{ inputs.editor_variant }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET="${DISPATCH_TARGET:?dispatch input target is required}"
            GALLERY_VARIANT="${DISPATCH_GALLERY_VARIANT:-debug}"
            EDITOR_VARIANT="${DISPATCH_EDITOR_VARIANT:-all}"
          else
            # The branch-scoped dogfood convention (2026-11-03): the branch
            # name names the target; the artifact is always the debug variant.
            case "$BRANCH" in
              tg-engine-apk-*) TARGET="engine";        GALLERY_VARIANT="debug"; EDITOR_VARIANT="none" ;;
              tg-modelpack-*)  TARGET="modelpack";     GALLERY_VARIANT="debug"; EDITOR_VARIANT="none" ;;
              *) echo "::error::branch '$BRANCH' matched no branch-scoped trigger convention (tg-engine-apk-* / tg-modelpack-*). Dispatch this workflow and pick a target instead."; exit 1 ;;
            esac
          fi

          # The model pack is an offline-provisioning DOGFOOD artifact (debug
          # key, ADR-0020): a release dispatch is forced back to debug, loudly.
          if [ "$TARGET" = "modelpack" ] && [ "$GALLERY_VARIANT" = "release" ]; then
            echo "::notice::the model-pack build is a debug-key dogfood artifact (ADR-0020); forcing the debug variant"
            GALLERY_VARIANT="debug"
          fi

          case "$TARGET" in
            engine|modelpack)
              GALLERY_RUN=true; EDITOR_RUN=false; EDITOR_TARGETS="[]" ;;
            editor)
              GALLERY_RUN=false; EDITOR_RUN=true
              case "$EDITOR_VARIANT" in
                all)     EDITOR_TARGETS='["edit-debug","edit-release","contract"]' ;;
                debug)   EDITOR_TARGETS='["edit-debug","contract"]' ;;
                release) EDITOR_TARGETS='["edit-release","contract"]' ;;
                *) echo "::error::unknown editor_variant '$EDITOR_VARIANT' (expected all | debug | release)"; exit 1 ;;
              esac ;;
            *)
              echo "::error::unknown target '$TARGET' (expected gallery-engine | gallery-modelpack | editor)"; exit 1 ;;
          esac

          echo "target=$TARGET gallery_variant=$GALLERY_VARIANT editor_variant=$EDITOR_VARIANT"
          {
            echo "target=$TARGET"
            echo "gallery_variant=$GALLERY_VARIANT"
            echo "editor_variant=$EDITOR_VARIANT"
            echo "gallery_run=$GALLERY_RUN"
            echo "editor_run=$EDITOR_RUN"
            echo "editor_targets=$EDITOR_TARGETS"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The gallery targets: the engine-enabled APK (target engine) and the same
  # + the offline FACE model pack (target modelpack). Full engine-cross
  # toolchain (Rust + cargo-ndk + the NDK + the Android SDK) --- the same
  # pins and cache keys everywhere, so main's warm caches restore unchanged.
  # ---------------------------------------------------------------------------
  gallery:
    name: Gallery (${{ needs.prepare.outputs.target }}, ${{ needs.prepare.outputs.gallery_variant }}) + artifacts
    needs: prepare
    if: needs.prepare.outputs.gallery_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GALLERY_TARGET: ${{ needs.prepare.outputs.target }}
      GALLERY_VARIANT: ${{ needs.prepare.outputs.gallery_variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail fast: the vendored engine workspace must be present (both gallery
      # targets package it).
      - name: Fail fast --- the vendored engine workspace must be present
        run: |
          missing=0
          for f in engine/Cargo.toml engine/scripts/build-android.sh docs/phase-5/ente-pin.md; do
            if [ ! -f "$f" ]; then
              echo "::error::required engine file '$f' is missing --- the vendored Ente engine workstream is not in this checkout. Restore it before dispatching a gallery target."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      # Fail fast: validate the engine_version input against the vendored pin.
      # The engine is vendored into this repo at the commit recorded in
      # docs/phase-5/ente-pin.md and cannot be swapped by a dispatch input.
      - name: Fail fast --- validate the engine_version input against the pin
        env:
          VERSION_INPUT: ${{ inputs.engine_version }}
        run: |
          if [ "$VERSION_INPUT" = "pinned" ] || [ -z "$VERSION_INPUT" ]; then
            echo "engine_version: pinned (the vendored pin in docs/phase-5/ente-pin.md)"
            exit 0
          fi
          PINNED="$(grep -m1 -oE '[0-9a-f]{40}' docs/phase-5/ente-pin.md || true)"
          if [ -z "$PINNED" ]; then
            echo "::error::could not read the pinned engine commit from docs/phase-5/ente-pin.md"
            exit 1
          fi
          case "$VERSION_INPUT" in
            "$PINNED"|"${PINNED:0:8}")
              echo "engine_version matches the pin: $PINNED" ;;
            *)
              echo "::error::engine_version '$VERSION_INPUT' does not match the vendored pin ($PINNED). The engine is VENDORED into this repo at the pin recorded in docs/phase-5/ente-pin.md and cannot be swapped by a dispatch input --- move the pin via that document's regeneration procedure instead."
              exit 1 ;;
          esac

      # Fail fast (release variant, engine target): the ADR-0018 signing
      # secrets must exist BEFORE the toolchain setup spends minutes.
      - name: Fail fast --- release variant requires the ADR-0018 signing secrets
        if: env.GALLERY_VARIANT == 'release'
        env:
          TG_RELEASE_KEYSTORE_BASE64: ${{ secrets.TG_RELEASE_KEYSTORE_BASE64 }}
          TG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          TG_RELEASE_KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          TG_RELEASE_KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in TG_RELEASE_KEYSTORE_BASE64 TG_RELEASE_KEYSTORE_PASSWORD TG_RELEASE_KEY_ALIAS TG_RELEASE_KEY_PASSWORD; do
            if [ -z "$(eval "echo \$$name")" ]; then
              echo "::error::required secret '$name' is not set --- release-variant builds sign with the ADR-0018 release key. Add it under Settings > Secrets and variables > Actions, or dispatch the debug variant instead."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      # The canonical toolchain setup (.github/actions/toad-setup): the full
      # engine-cross shape (Rust + aarch64 target + the android cargo cache +
      # cargo-ndk + the NDK resolve + the whole Android side), same pins,
      # same cache keys as ci.yml's engine-android job (warm caches apply).
      - name: Set up the toolchain (Rust Android cross + Android)
        uses: ./.github/actions/toad-setup
        with:
          rust: android

      # THE model-pack step (target modelpack only): fetch the pinned FACE
      # assets from the single allowlisted host and verify size + SHA-256
      # against the pin BEFORE anything packages them (the same discipline
      # the in-app downloader + provisioner apply; here it keeps a tampered/
      # moved upstream asset from ever riding into an APK). Staged into the
      # build-dir assets srcDir that -PwithBundledModels wires (never
      # src/main). Sizes + SHA-256 are transcribed from ModelManifest.kt
      # (itself transcribed from the vendored ente-ml assets.rs at the pin).
      - name: Stage the pinned FACE model pack (offline provisioning)
        if: env.GALLERY_TARGET == 'modelpack'
        run: |
          set -euo pipefail
          DEST="apps/gallery/build/bundled-models/models"
          mkdir -p "$DEST"
          fetch_model() {
            local name="$1" size="$2" sha="$3"
            echo "fetching $name ($size bytes) from models.ente.com"
            curl -fSL --retry 3 --max-time 900 -o "$DEST/$name" "https://models.ente.com/$name"
            local got_size got_sha
            got_size="$(wc -c < "$DEST/$name" | tr -d ' ')"
            got_sha="$(sha256sum "$DEST/$name" | cut -d' ' -f1)"
            [ "$got_size" = "$size" ] || { echo "::error::$name: size $got_size != pinned $size"; exit 1; }
            [ "$got_sha" = "$sha" ]  || { echo "::error::$name: sha256 $got_sha != pinned $sha"; exit 1; }
            echo "  verified: $name ($got_size bytes, $got_sha)"
          }
          fetch_model "yolov5s_face_640_640_static_b1.onnx" \
            "32355091" \
            "e047647409403d52696035ecd445792173e50d7fbdcccac97b958a585db9aa3d"
          fetch_model "mobilefacenet_portable_static_b1.onnx" \
            "5278803" \
            "0763fc33f54e138476194da95e87e133b3e976075a6b1d3e1b2caedb251b1a36"
          ls -la "$DEST"
          sha256sum "$DEST"/*

      # ADR-0018 contract (release variant, engine target), mirrored verbatim
      # from release.yml: the Gradle signingConfig reads exactly these four
      # TG_* env vars. Debug dispatches skip both steps entirely (debug key,
      # like every other test build).
      - name: Decode release keystore (release variant only)
        if: env.GALLERY_VARIANT == 'release'
        run: |
          echo "${{ secrets.TG_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/toadgallery-release.jks"
          chmod 600 "$RUNNER_TEMP/toadgallery-release.jks"
          if [ ! -s "$RUNNER_TEMP/toadgallery-release.jks" ]; then
            echo "::error::decoded keystore is empty --- is TG_RELEASE_KEYSTORE_BASE64 set (ADR-0018)?"
            exit 1
          fi

      - name: Export signing environment for Gradle (release variant only)
        if: env.GALLERY_VARIANT == 'release'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          TG_KEYSTORE_FILE=$RUNNER_TEMP/toadgallery-release.jks
          TG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          TG_KEY_ALIAS=$KEY_ALIAS
          TG_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      # The assemble. -PwithEngine registers the buildRustEngine Exec task
      # (preBuild dependency runs engine/scripts/build-android.sh, idempotent):
      # cargo-ndk builds libtoad_ml_jni.so + stages the sha256-pinned
      # libonnxruntime.so (ORT 1.31.0) for arm64-v8a into
      # apps/gallery/build/rust-jniLibs/, which the jniLibs srcDir packages.
      # -PwithBundledModels (modelpack target) adds the staged models as an
      # assets srcDir. tee + pipefail keeps the exit code while persisting
      # the full log for the on-failure upload below. r46: the ENGINE flavor
      # (applicationIdSuffix .engine, the full BuildShape) --- the output
      # paths are flavor-qualified (apk/engine/<variant>/).
      - name: Assemble the engine-enabled (${{ needs.prepare.outputs.gallery_variant }}) APK
        run: |
          set -o pipefail
          PROPS="-PwithEngine"
          if [ "$GALLERY_TARGET" = "modelpack" ]; then
            PROPS="$PROPS -PwithBundledModels"
          fi
          if [ "$GALLERY_VARIANT" = "release" ]; then
            TASK=":apps:gallery:assembleEngineRelease"
          else
            TASK=":apps:gallery:assembleEngineDebug"
          fi
          echo "task: $TASK $PROPS"
          ./gradlew "$TASK" $PROPS --no-daemon --stacktrace 2>&1 | tee build-output.log

      # Gate 1 (every gallery target): the engine-enabled APK must carry BOTH
      # native libraries (a silently broken jniLibs wiring would otherwise
      # pass the assemble step).
      - name: Verify the native libraries are packaged
        run: |
          APK="$(ls "apps/gallery/build/outputs/apk/engine/$GALLERY_VARIANT/"*.apk)"
          echo "APK: $APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libtoad_ml_jni.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libonnxruntime.so"

      # Gate 2 (modelpack target only): the APK must carry BOTH staged model
      # assets under assets/models/ --- a silently broken assets srcDir wiring
      # would otherwise pass the assemble step, and the build would ship as
      # "offline-provisioned" while provisioning from the network after all.
      - name: Verify the model pack is packaged under assets
        if: env.GALLERY_TARGET == 'modelpack'
        run: |
          APK="$(ls "apps/gallery/build/outputs/apk/engine/$GALLERY_VARIANT/"*.apk)"
          unzip -l "$APK" | grep "assets/models/yolov5s_face_640_640_static_b1.onnx"
          unzip -l "$APK" | grep "assets/models/mobilefacenet_portable_static_b1.onnx"

      # Gate 3 (every gallery target): the APK identity --- the variant-correct
      # application id and the versionCode/versionName DERIVED from the
      # checkout's own build.gradle.kts. The derivation rule: the gallery
      # gradle keeps history as COMMENTED pairs with ONE live assignment
      # (first match is the live one --- the same rule release.yml applies);
      # the EDITOR leg below uses tail -1 because that file appends LIVE
      # pairs (last wins, the r43 catch). The old modelpack workflow's
      # hardcoded >= 32 baseline and r28 artifact name are retired by this
      # derivation --- nothing to rot when the version moves.
      - name: Verify APK identity (package + the checkout's version)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -name aapt2 | sort -V | tail -1)"
          if [ -z "$AAPT2" ]; then echo "::error::aapt2 not found under $SDK_ROOT/build-tools"; exit 1; fi
          APK="$(ls "apps/gallery/build/outputs/apk/engine/$GALLERY_VARIANT/"*.apk)"
          EXPECTED_VC="$(grep -m1 -oE 'versionCode = [0-9]+' apps/gallery/build.gradle.kts | grep -oE '[0-9]+' | head -1)"
          if [ -z "$EXPECTED_VC" ]; then echo "::error::could not derive versionCode from apps/gallery/build.gradle.kts"; exit 1; fi
          # r46: the ENGINE flavor's applicationIdSuffix composes with the
          # buildType's: .engine.release -> io.github.dukeoftoad.gallery.engine,
          # .engine.debug -> io.github.dukeoftoad.gallery.engine.debug.
          if [ "$GALLERY_VARIANT" = "release" ]; then
            EXPECTED_ID="io.github.dukeoftoad.gallery.engine"
          else
            EXPECTED_ID="io.github.dukeoftoad.gallery.engine.debug"
          fi
          BADGE="$("$AAPT2" dump badging "$APK" | head -1)"
          echo "badging: $BADGE"
          echo "derived expected versionCode: $EXPECTED_VC / expected id: $EXPECTED_ID"
          echo "$BADGE" | grep -q "name='$EXPECTED_ID'" \
            || { echo "::error::unexpected application id (expected $EXPECTED_ID for the $GALLERY_VARIANT variant)"; exit 1; }
          echo "$BADGE" | grep -q "versionCode='$EXPECTED_VC'" \
            || { echo "::error::unexpected versionCode (expected $EXPECTED_VC, derived from the checkout)"; exit 1; }

      # Stage under the unified convention: the checkout's own versionName,
      # the target, the variant --- plus the .sha256 sidecar and the R8
      # mapping.txt when present (debug builds are not minified --- expected
      # warning; release builds MUST produce one).
      - name: Stage the APK + R8 mapping
        run: |
          APK="$(ls "apps/gallery/build/outputs/apk/engine/$GALLERY_VARIANT/"*.apk)"
          VERSION_NAME="$(grep -m1 -oE 'versionName = "[^"]+"' apps/gallery/build.gradle.kts | sed -e 's/versionName = //' -e 's/"//g')"
          if [ -z "$VERSION_NAME" ]; then echo '::error::could not derive versionName'; exit 1; fi
          STAGE="$RUNNER_TEMP/apk-staging"
          mkdir -p "$STAGE"
          APK_NAME="toadGALLERY-${VERSION_NAME}-${GALLERY_TARGET}-engine-${GALLERY_VARIANT}.apk"
          cp "$APK" "$STAGE/$APK_NAME"
          ( cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          if [ "$GALLERY_VARIANT" = "release" ]; then
            MAPPING="apps/gallery/build/outputs/mapping/engineRelease/mapping.txt"
          else
            MAPPING="apps/gallery/build/outputs/mapping/engineDebug/mapping.txt"
          fi
          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" "$STAGE/"
          else
            echo "::warning::no R8 mapping at $MAPPING (debug builds are not minified --- expected; release builds MUST produce one)"
          fi
          ls -la "$STAGE"
          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "APK_NAME=$APK_NAME"
          } >> "$GITHUB_ENV"

      - name: Upload APK + mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: toadGALLERY-${{ env.VERSION_NAME }}-${{ env.GALLERY_TARGET }}-engine-${{ env.GALLERY_VARIANT }}
          path: ${{ runner.temp }}/apk-staging/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-gallery-${{ env.GALLERY_TARGET }}-logs-${{ github.run_id }}
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          SIGNING="debug key (test build, not a release)"
          if [ "${GALLERY_VARIANT:-debug}" = "release" ]; then
            SIGNING="ADR-0018 release key (TG_* secrets)"
          fi
          {
            echo "## APK build --- gallery (${{ env.GALLERY_TARGET }})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Target | \`${GALLERY_TARGET:-unknown}\` |"
            echo "| Variant | \`${GALLERY_VARIANT:-unknown}\` |"
            echo "| Engine | vendored pin (docs/phase-5/ente-pin.md) |"
            if [ "${GALLERY_TARGET:-}" = "modelpack" ]; then
              echo "| Model pack | FACE pack, staged + sha256-verified at build time (ADR-0020) |"
            fi
            echo "| versionName | \`${VERSION_NAME:-not reached}\` |"
            echo "| APK artifact | \`toadGALLERY-${VERSION_NAME:-?}-${GALLERY_TARGET:-?}-engine-${GALLERY_VARIANT:-?}\` |"
            echo "| Signing | $SIGNING |"
            echo ""
            echo "Engine chain: cargo-ndk arm64-v8a -> libtoad_ml_jni.so + sha256-pinned libonnxruntime.so (ORT 1.31.0) -> -PwithEngine packaging; both .so files verified inside the APK."
            echo ""
            echo "NOT a release: no tag was cut and no GitHub Release was created (release.yml stays the only signing release path, ADR-0018)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The editor target: ALL editor surfaces in ONE fail-fast=false matrix ---
  # edit-debug (the .debug dogfood APK, identity-gated), edit-release (the
  # R8/compile gate, UNSIGNED by design --- the editor declares no signing
  # config and ADR-0018 keeps release signing in release.yml only), and
  # contract (the :shared:editor-contract module + its JVM tests + the jar).
  # Pure Android toolchain: no Rust/NDK (the editor is pure Kotlin), keeping
  # this job cheap.
  # ---------------------------------------------------------------------------
  editor:
    needs: prepare
    name: editor (${{ matrix.editor_target }})
    if: needs.prepare.outputs.editor_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One target failing must not cancel the others: "include all" means
      # every selected target reports its own outcome.
      fail-fast: false
      matrix:
        editor_target: ${{ fromJSON(needs.prepare.outputs.editor_targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The canonical toolchain setup (.github/actions/toad-setup): the
      # pure-Android shape (JDK 17 + SDK platform 36/build-tools 36 + the
      # Gradle cache + gradlew chmod; no Rust).
      - name: Set up the toolchain (Android)
        uses: ./.github/actions/toad-setup

      # --- leg: edit-debug (the debug APK deliverable) -----------------------
      - name: Assemble the editor debug APK
        if: matrix.editor_target == 'edit-debug'
        run: |
          set -o pipefail
          ./gradlew :apps:edit:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Verify editor APK identity (edit-debug)
        if: matrix.editor_target == 'edit-debug'
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -name aapt2 | sort -V | tail -1)"
          if [ -z "$AAPT2" ]; then echo "::error::aapt2 not found under $SDK_ROOT/build-tools"; exit 1; fi
          APK="$(ls apps/edit/build/outputs/apk/debug/*.apk)"
          # The EDITOR gradle appends LIVE versionCode/versionName pairs per
          # round --- the LAST pair is the effective one (last-wins, the
          # file's own convention; the r43 catch from the failed run 41991485246
          # at f610860: grep -m1 grabbed the OLDEST pair, so the gate compared
          # the APK's real versionCode against a stale expectation). tail -1
          # reads the effective pair.
          EXPECTED_VC="$(grep -oE 'versionCode = [0-9]+' apps/edit/build.gradle.kts | grep -oE '[0-9]+' | tail -1)"
          if [ -z "$EXPECTED_VC" ]; then echo "::error::could not derive versionCode from apps/edit/build.gradle.kts"; exit 1; fi
          BADGE="$("$AAPT2" dump badging "$APK" | head -1)"
          echo "badging: $BADGE"
          echo "derived expected versionCode: $EXPECTED_VC"
          echo "$BADGE" | grep -q "name='io.github.dukeoftoad.gallery.edit.debug'" \
            || { echo "::error::unexpected application id (expected the .debug variant)"; exit 1; }
          echo "$BADGE" | grep -q "versionCode='$EXPECTED_VC'" \
            || { echo "::error::unexpected versionCode (expected $EXPECTED_VC, derived from the checkout)"; exit 1; }

      - name: Stage the editor debug APK (edit-debug)
        if: matrix.editor_target == 'edit-debug'
        run: |
          APK="$(ls apps/edit/build/outputs/apk/debug/*.apk)"
          VERSION_NAME="$(grep -oE 'versionName = "[^"]+"' apps/edit/build.gradle.kts | tail -1 | sed -e 's/versionName = //' -e 's/"//g')"
          if [ -z "$VERSION_NAME" ]; then echo '::error::could not derive versionName from apps/edit/build.gradle.kts'; exit 1; fi
          STAGE="$RUNNER_TEMP/edit-apk-staging"
          mkdir -p "$STAGE"
          APK_NAME="toadGALLERY-Edit-${VERSION_NAME}-debug.apk"
          cp "$APK" "$STAGE/$APK_NAME"
          ( cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          ls -la "$STAGE"
          echo "EDITOR_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "EDITOR_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload the editor debug APK artifact (edit-debug)
        if: matrix.editor_target == 'edit-debug'
        uses: actions/upload-artifact@v4
        with:
          name: toadGALLERY-Edit-${{ env.EDITOR_VERSION_NAME }}-debug
          path: ${{ runner.temp }}/edit-apk-staging/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --- leg: edit-release (unsigned R8/compile gate, BY DESIGN) -----------
      - name: Assemble the editor release APK --- unsigned by design
        if: matrix.editor_target == 'edit-release'
        run: |
          set -o pipefail
          # The editor's release build type declares no signing config
          # (apps/edit/build.gradle.kts) and ADR-0018 keeps release signing in
          # release.yml only --- this leg is the R8/compile gate; the artifact
          # below is an UNSIGNED QA build, never for publishing.
          ./gradlew :apps:edit:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Stage the unsigned editor release APK (edit-release)
        if: matrix.editor_target == 'edit-release'
        run: |
          APK="$(ls apps/edit/build/outputs/apk/release/*.apk)"
          case "$APK" in
            *unsigned*) : ;; # the expected unsigned output
            *) echo "::warning::release APK does not carry the -unsigned suffix ($APK) --- verify no signing config leaked into :apps:edit" ;;
          esac
          VERSION_NAME="$(grep -oE 'versionName = "[^"]+"' apps/edit/build.gradle.kts | tail -1 | sed -e 's/versionName = //' -e 's/"//g')"
          STAGE="$RUNNER_TEMP/edit-apk-staging"
          mkdir -p "$STAGE"
          APK_NAME="toadGALLERY-Edit-${VERSION_NAME}-release-UNSIGNED.apk"
          cp "$APK" "$STAGE/$APK_NAME"
          ( cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          ls -la "$STAGE"
          echo "EDITOR_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Upload the unsigned editor release artifact (edit-release)
        if: matrix.editor_target == 'edit-release'
        uses: actions/upload-artifact@v4
        with:
          name: toadGALLERY-Edit-${{ env.EDITOR_VERSION_NAME }}-release-UNSIGNED
          path: ${{ runner.temp }}/edit-apk-staging/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --- leg: contract (the shared module both apps must agree on) ---------
      - name: Build + test the shared editor contract module
        if: matrix.editor_target == 'contract'
        run: |
          set -o pipefail
          ./gradlew :shared:editor-contract:assemble :shared:editor-contract:test --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Upload the contract jar artifact (contract)
        if: matrix.editor_target == 'contract'
        uses: actions/upload-artifact@v4
        with:
          name: editor-contract-jar
          path: shared/editor-contract/build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --- per-leg diagnostics + summary --------------------------------------
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-editor-${{ matrix.editor_target }}-logs-${{ github.run_id }}
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary (this matrix leg)
        if: always()
        run: |
          {
            echo "## APK build --- editor · leg \`${{ matrix.editor_target }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Trigger variant | \`${{ needs.prepare.outputs.editor_variant }}\` |"
            if [ -n "$EDITOR_VERSION_NAME" ]; then
              echo "| Editor versionName | \`$EDITOR_VERSION_NAME\` |"
            fi
            case "${{ matrix.editor_target }}" in
              edit-debug)   echo "| Artifact | \`toadGALLERY-Edit-${EDITOR_VERSION_NAME:-?}-debug\` (debug key) |" ;;
              edit-release) echo "| Artifact | \`toadGALLERY-Edit-${EDITOR_VERSION_NAME:-?}-release-UNSIGNED\` (unsigned by ADR-0018 — QA only) |" ;;
              contract)     echo "| Artifact | \`editor-contract-jar\` (JVM tests included) |" ;;
            esac
            echo ""
            echo "Editor targets covered: edit-debug · edit-release · contract (all editor surfaces; the editor has no product flavors)."
          } >> "$GITHUB_STEP_SUMMARY"
