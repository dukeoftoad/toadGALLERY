name: APK builds (test artifacts)

# toadGALLERY Edit --- the consolidated test-APK builder. ONE dispatch
# surface covers every editor target in a fail-fast=false matrix:
#   - edit-debug: the .debug dogfood APK, identity-gated
#   - edit-release: the R8/compile gate, UNSIGNED by design (the editor
#     declares no signing config and ADR-0018 keeps release signing in
#     release.yml only)
#   - contract: the :shared:editor-contract module + its JVM tests + the jar
# Pure Android toolchain (no Rust/NDK --- the editor is pure Kotlin).
#
# Version derivation: editor/app/build.gradle.kts is the single source; the
# gates verify the derived values against the actual APK via aapt2.
#
# Least-privilege: `permissions: contents: read` at the top --- this
# workflow uploads artifacts and never touches releases (the ADR-0018
# contract: release.yml stays the ONLY signing/publishing path; no tag is
# cut and no GitHub Release is created here, ever).

on:
  workflow_dispatch:
    inputs:
      editor_variant:
        description: 'Editor targets (editor only): all = debug + release + contract (default). The contract leg always runs.'
        type: choice
        options:
          - all
          - debug
          - release
        default: all
        required: false

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Prepare: resolve the editor target matrix from the dispatch input, so the
  # build job below stays declarative. Anything unknown fail-fasts here,
  # before a runner spends toolchain minutes.
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve the build target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      editor_variant: ${{ steps.resolve.outputs.editor_variant }}
      editor_run: ${{ steps.resolve.outputs.editor_run }}
      editor_targets: ${{ steps.resolve.outputs.editor_targets }}
    steps:
      - name: Resolve the editor targets from the dispatch input
        id: resolve
        env:
          DISPATCH_EDITOR_VARIANT: ${{ inputs.editor_variant }}
        run: |
          set -euo pipefail
          EDITOR_VARIANT="${DISPATCH_EDITOR_VARIANT:-all}"
          case "$EDITOR_VARIANT" in
            all)     EDITOR_TARGETS='["edit-debug","edit-release","contract"]' ;;
            debug)   EDITOR_TARGETS='["edit-debug","contract"]' ;;
            release) EDITOR_TARGETS='["edit-release","contract"]' ;;
            *) echo "::error::unknown editor_variant '$EDITOR_VARIANT' (expected all | debug | release)"; exit 1 ;;
          esac
          echo "editor_variant=$EDITOR_VARIANT"
          {
            echo "editor_variant=$EDITOR_VARIANT"
            echo "editor_run=true"
            echo "editor_targets=$EDITOR_TARGETS"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The editor target: ALL editor surfaces in ONE fail-fast=false matrix ---
  # edit-debug (the .debug dogfood APK, identity-gated), edit-release (the
  # R8/compile gate, UNSIGNED by design --- the editor declares no signing
  # config and ADR-0018 keeps release signing in release.yml only), and
  # contract (the :shared:editor-contract module + its JVM tests + the jar).
  # Pure Android toolchain: no Rust/NDK (the editor is pure Kotlin), keeping
  # this job cheap.
  # ---------------------------------------------------------------------------
  editor:
    needs: prepare
    name: editor (${{ matrix.editor_target }})
    if: needs.prepare.outputs.editor_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One target failing must not cancel the others: "include all" means
      # every selected target reports its own outcome.
      fail-fast: false
      matrix:
        editor_target: ${{ fromJSON(needs.prepare.outputs.editor_targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The canonical toolchain setup (.github/actions/toad-setup): the
      # pure-Android shape (JDK 17 + SDK platform 36/build-tools 36 + the
      # Gradle cache + gradlew chmod).
      - name: Set up the toolchain (Android)
        uses: ./.github/actions/toad-setup

      # --- leg: edit-debug (the debug APK deliverable) -----------------------
      - name: Assemble the editor debug APK
        if: matrix.editor_target == 'edit-debug'
        run: |
          set -o pipefail
          ./gradlew :editor:app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Verify editor APK identity (edit-debug)
        if: matrix.editor_target == 'edit-debug'
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # Resolve aapt2 from the exact pinned build-tools dir first
          # (the same 36.0.0 toad-setup installs), glob fallback only if the
          # runner layout differs.
          AAPT2="$SDK_ROOT/build-tools/36.0.0/aapt2"
          if [ ! -x "$AAPT2" ]; then
            AAPT2="$(find "$SDK_ROOT/build-tools" -name aapt2 | sort -V | tail -1)"
          fi
          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then echo "::error::aapt2 not found under $SDK_ROOT/build-tools"; exit 1; fi
          APK="$(ls editor/app/build/outputs/apk/debug/*.apk)"
          EXPECTED_VC="$(grep -oE 'versionCode = [0-9]+' editor/app/build.gradle.kts | grep -oE '[0-9]+' | tail -1)"
          if [ -z "$EXPECTED_VC" ]; then echo "::error::could not derive versionCode from editor/app/build.gradle.kts"; exit 1; fi
          BADGE="$("$AAPT2" dump badging "$APK" | head -1)"
          echo "badging: $BADGE"
          echo "derived expected versionCode: $EXPECTED_VC"
          echo "$BADGE" | grep -q "name='com.toadgallery.editor.debug'" \
            || { echo "::error::unexpected application id (expected the .debug variant)"; exit 1; }
          echo "$BADGE" | grep -q "versionCode='$EXPECTED_VC'" \
            || { echo "::error::unexpected versionCode (expected $EXPECTED_VC, derived from the checkout)"; exit 1; }

      - name: Stage the editor debug APK (edit-debug)
        if: matrix.editor_target == 'edit-debug'
        run: |
          APK="$(ls editor/app/build/outputs/apk/debug/*.apk)"
          VERSION_NAME="$(grep -oE 'versionName = "[^"]+"' editor/app/build.gradle.kts | tail -1 | sed -e 's/versionName = //' -e 's/"//g')"
          if [ -z "$VERSION_NAME" ]; then echo '::error::could not derive versionName from editor/app/build.gradle.kts'; exit 1; fi
          STAGE="$RUNNER_TEMP/edit-apk-staging"
          mkdir -p "$STAGE"
          APK_NAME="toadGALLERY-Edit-${VERSION_NAME}-debug.apk"
          cp "$APK" "$STAGE/$APK_NAME"
          ( cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          ls -la "$STAGE"
          echo "EDITOR_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "EDITOR_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload the editor debug APK artifact (edit-debug)
        if: matrix.editor_target == 'edit-debug'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toadGALLERY-Edit-${{ env.EDITOR_VERSION_NAME }}-debug
          path: ${{ runner.temp }}/edit-apk-staging/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --- leg: edit-release (unsigned R8/compile gate, BY DESIGN) -----------
      - name: Assemble the editor release APK --- unsigned by design
        if: matrix.editor_target == 'edit-release'
        run: |
          set -o pipefail
          # The editor's release build type declares no signing config
          # (editor/app/build.gradle.kts) and ADR-0018 keeps release signing
          # in release.yml only --- this leg is the R8/compile gate; the
          # artifact below is an UNSIGNED QA build, never for publishing.
          ./gradlew :editor:app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Stage the unsigned editor release APK (edit-release)
        if: matrix.editor_target == 'edit-release'
        run: |
          APK="$(ls editor/app/build/outputs/apk/release/*.apk)"
          case "$APK" in
            *unsigned*) : ;; # the expected unsigned output
            *) echo "::warning::release APK does not carry the -unsigned suffix ($APK) --- verify no signing config leaked into :editor:app" ;;
          esac
          VERSION_NAME="$(grep -oE 'versionName = "[^"]+"' editor/app/build.gradle.kts | tail -1 | sed -e 's/versionName = //' -e 's/"//g')"
          STAGE="$RUNNER_TEMP/edit-apk-staging"
          mkdir -p "$STAGE"
          APK_NAME="toadGALLERY-Edit-${VERSION_NAME}-release-UNSIGNED.apk"
          cp "$APK" "$STAGE/$APK_NAME"
          ( cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          ls -la "$STAGE"
          echo "EDITOR_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Upload the unsigned editor release artifact (edit-release)
        if: matrix.editor_target == 'edit-release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toadGALLERY-Edit-${{ env.EDITOR_VERSION_NAME }}-release-UNSIGNED
          path: ${{ runner.temp }}/edit-apk-staging/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --- leg: contract (the shared module both shells agree on) ------------
      - name: Build + test the shared editor contract module
        if: matrix.editor_target == 'contract'
        run: |
          set -o pipefail
          ./gradlew :shared:editor-contract:assemble :shared:editor-contract:test --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Upload the contract jar artifact (contract)
        if: matrix.editor_target == 'contract'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editor-contract-jar
          path: shared/editor-contract/build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --- per-leg diagnostics + summary --------------------------------------
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-build-editor-${{ matrix.editor_target }}-logs-${{ github.run_id }}
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary (this matrix leg)
        if: always()
        run: |
          {
            echo "## APK build --- editor · leg \`${{ matrix.editor_target }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Trigger variant | \`${{ needs.prepare.outputs.editor_variant }}\` |"
            if [ -n "$EDITOR_VERSION_NAME" ]; then
              echo "| Editor versionName | \`$EDITOR_VERSION_NAME\` |"
            fi
            case "${{ matrix.editor_target }}" in
              edit-debug)   echo "| Artifact | \`toadGALLERY-Edit-${EDITOR_VERSION_NAME:-?}-debug\` (debug key) |" ;;
              edit-release) echo "| Artifact | \`toadGALLERY-Edit-${EDITOR_VERSION_NAME:-?}-release-UNSIGNED\` (unsigned by ADR-0018 — QA only) |" ;;
              contract)     echo "| Artifact | \`editor-contract-jar\` (JVM tests included) |" ;;
            esac
            echo ""
            echo "Editor targets covered: edit-debug · edit-release · contract (all editor surfaces; the editor has no product flavors)."
          } >> "$GITHUB_STEP_SUMMARY"
