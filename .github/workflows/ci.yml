name: CI

# toadGALLERY Edit CI --- ADR-0013. The canonical build, lint, and test
# workflow for the editor-only repo (editor/app, editor/core,
# shared/editor-contract, shared/video-edit). JDK 17 + Android SDK + Gradle.
# A green CI check is required to merge any PR. Push-to-main triggers
# nothing here: release.yml is the post-merge release build, so this
# workflow stays the canonical PR gate (pull_request on main + manual
# dispatch for on-demand verification).

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least-privilege: the canonical gate only reads the checkout and uploads
# artifacts --- no release, no publish, no admin surfaces.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The canonical toolchain setup (.github/actions/toad-setup): the
      # pure-Android shape (JDK 17 + SDK platform 36/build-tools 36 + the
      # Gradle cache + gradlew chmod).
      - name: Set up the toolchain (Android)
        uses: ./.github/actions/toad-setup

      - name: Build editor debug APK
        run: ./gradlew :editor:app:assembleDebug --no-daemon --stacktrace

      - name: Run editor lint
        run: ./gradlew :editor:app:lintDebug --no-daemon --stacktrace
        # Hard gate: lint errors fail CI.

      - name: Run editor + contract unit tests
        run: ./gradlew :editor:app:testDebugUnitTest :shared:editor-contract:test --no-daemon --stacktrace

      - name: Upload editor APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: edit-debug-apk
          path: editor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lint-reports
          path: editor/app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-reports
          path: |
            editor/app/build/reports/tests/
            shared/editor-contract/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
