name: CI

# toadGALLERY CI --- ADR-0013
# Canonical build, lint, and test workflow. JDK 17 + Android SDK + Gradle.
# No Flutter (ADR-0008). A green CI check is required to merge any PR.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GH ubuntu runners ship a preinstalled Android SDK at $ANDROID_HOME
      # (cmdline-tools included) but do not always put sdkmanager on PATH, and
      # android-actions/setup-android@v3 is broken on current images (it runs the
      # legacy `sdkmanager tools` package, which no longer exists). Resolve the
      # binary directly and install only what the project pins.
      - name: Install Android SDK packages (platform 36, build-tools 36)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDK_MGR="$(command -v sdkmanager)"
          else
            SDK_MGR="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -1)"
          fi
          echo "Using sdkmanager: $SDK_MGR"
          yes | "$SDK_MGR" --licenses > /dev/null || true
          "$SDK_MGR" --install "platforms;android-36" "build-tools;36.0.0"
          "$SDK_MGR" --list_installed | grep -E "platforms;android-36|build-tools;36" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :apps:gallery:assembleDebug --no-daemon --stacktrace

      - name: Run lint
        run: ./gradlew :apps:gallery:lintDebug --no-daemon --stacktrace
        continue-on-error: true # lint failures are warnings until Phase 2 cleanup

      - name: Run unit tests
        run: ./gradlew :apps:gallery:testDebugUnitTest --no-daemon --stacktrace
        # Binding since the issue #20 privacy policy tests landed; lint stays
        # non-binding until the Phase 2 cleanup pass.

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-debug-apk
          path: apps/gallery/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: apps/gallery/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: apps/gallery/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  connected-privacy:
    name: Instrumented privacy suite (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build # only pay for an emulator when the assemble/lint/test job is green

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Same SDK pinning as the build job: connectedDebugAndroidTest compiles
      # the app + androidTest APKs first, so platform 36 / build-tools 36 are
      # needed here too. The emulator-runner action installs the emulator and
      # the API 34 system image itself.
      - name: Install Android SDK packages (platform 36, build-tools 36)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDK_MGR="$(command -v sdkmanager)"
          else
            SDK_MGR="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -1)"
          fi
          echo "Using sdkmanager: $SDK_MGR"
          yes | "$SDK_MGR" --licenses > /dev/null || true
          "$SDK_MGR" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # AOSP ('default') image: closest to the privacy posture we ship for.
      # ubuntu-latest runners expose /dev/kvm, so this boots with hardware
      # acceleration. Suite: apps/gallery/src/androidTest (issue #20).
      #
      # Retry (observed on main, runs #12 and #18): the APK install-commit
      # can die with 'Broken pipe (32)' --- a transient package-manager/adb
      # failure on hosted KVM runners, before any test runs. The retry logic
      # lives in .github/scripts/emulator-privacy-suite.sh: one rerun on the
      # same booted emulator, no second ~7-minute emulator boot; deterministic
      # test failures fail both attempts and stay red. It is a file because
      # the 'script' input goes through sh -c "..." wrapping --- inline double
      # quotes corrupt the command line (run #19).
      - name: Run instrumented privacy suite on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/scripts/emulator-privacy-suite.sh

      - name: Upload connected test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-test-reports
          path: apps/gallery/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
