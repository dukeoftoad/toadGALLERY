name: CI

# toadGALLERY CI --- ADR-0013
# Canonical build, lint, and test workflow. JDK 17 + Android SDK + Gradle.
# No Flutter (ADR-0008). A green CI check is required to merge any PR.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GH-hosted runners ship the Android SDK + cmdline-tools; install the
      # exact packages the project pins (compileSdk/targetSdk 36) via sdkmanager.
      # (android-actions/setup-android v3 has no reliable `packages` input.)
      - name: Set up Android SDK (platform 36, build-tools 36)
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --list_installed | grep -E "android-36|build-tools;36" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :apps:gallery:assembleDebug --no-daemon --stacktrace

      - name: Run lint
        run: ./gradlew :apps:gallery:lintDebug --no-daemon --stacktrace
        continue-on-error: true # lint failures are warnings until Phase 2 cleanup

      - name: Run unit tests
        run: ./gradlew :apps:gallery:testDebugUnitTest --no-daemon --stacktrace
        continue-on-error: true # no tests yet; becomes binding as tests land

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-debug-apk
          path: apps/gallery/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: apps/gallery/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: apps/gallery/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
