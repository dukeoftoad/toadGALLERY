name: Dependency review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency diff
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high/critical risk; avoid unexpectedly blocking routine
          # transitive updates at moderate severity.
          fail-on-severity: high
          comment-summary-in-pr: always
