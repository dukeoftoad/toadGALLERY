name: Editor APK build — include all

# toadGALLERY --- the dispatch-only builder for the toadGALLERY Edit surface
# (2026-11-04 workplan window, docs/workplan.md P4).
#
# "Include all" contract: ONE job builds ALL editor targets in a single
# matrix rather than duplicate workflows:
#   - edit-debug    : :apps:edit assembleDebug --- THE debug APK deliverable
#                     (the .debug dogfood id), identity-gated + uploaded.
#   - edit-release  : :apps:edit assembleRelease --- the R8/compile gate for
#                     the release build type. UNSIGNED BY DESIGN: the editor's
#                     release build type declares no signing config
#                     (apps/edit/build.gradle.kts) and ADR-0018 keeps release
#                     signing in release.yml only; this artifact is for QA,
#                     never for publishing.
#   - contract      : :shared:editor-contract assemble + its JVM test suite +
#                     the contract jar artifact (the module both apps must
#                     agree on; editor-side surface per ADR-0002/ADR-0007).
# The editor has NO product flavors (verified in apps/edit/build.gradle.kts),
# so build types + the shared contract module ARE all editor targets.
# The `build_variant` input narrows the assemble legs; the contract leg is
# variant-independent and always runs.
#
# Rust/NDK deliberately absent: the editor is pure Kotlin (no -PwithEngine
# wiring exists for :apps:edit) --- this keeps the editor builder cheap.
#
# Reuse policy: the repo has no composite actions / reusable workflows
# (verified 2026-11-04); setup blocks replicate ci.yml's build job verbatim
# (same pins, same cache keys). Composite-action extraction: follow-up.md F-2.
#
# Triggers: workflow_dispatch ONLY --- ci.yml already gates PRs/main and
# release.yml owns v* tags (the repo's existing trigger pattern).

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Which editor build type(s) to assemble. all = debug + release + contract (default). The contract leg always runs.'
        type: choice
        options:
          - all
          - debug
          - release
        default: all
        required: true

concurrency:
  group: editor-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve the editor target matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.set.outputs.targets }}
    steps:
      - name: Resolve targets from the build_variant input
        id: set
        env:
          VARIANT: ${{ github.event.inputs.build_variant }}
        run: |
          case "$VARIANT" in
            all)     TARGETS='["edit-debug","edit-release","contract"]' ;;
            debug)   TARGETS='["edit-debug","contract"]' ;;
            release) TARGETS='["edit-release","contract"]' ;;
            *) echo "::error::unknown build_variant '$VARIANT' (expected all | debug | release)"; exit 1 ;;
          esac
          echo "editor targets: $TARGETS"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  editor:
    needs: prepare
    name: editor (${{ matrix.editor_target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One target failing must not cancel the others: "include all" means
      # every selected target reports its own outcome.
      fail-fast: false
      matrix:
        editor_target: ${{ fromJSON(needs.prepare.outputs.targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Same SDK package pins as ci.yml (platform 36, build-tools 36).
      - name: Install Android SDK packages (platform 36, build-tools 36)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDK_MGR="$(command -v sdkmanager)"
          else
            SDK_MGR="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' | sort | tail -1)"
          fi
          echo "Using sdkmanager: $SDK_MGR"
          yes | "$SDK_MGR" --licenses > /dev/null || true
          "$SDK_MGR" --install "platforms;android-36" "build-tools;36.0.0"
          "$SDK_MGR" --list_installed | grep -E "platforms;android-36|build-tools;36" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # --- leg: edit-debug (the debug APK deliverable) -----------------------
      - name: Assemble the editor debug APK
        if: matrix.editor_target == 'edit-debug'
        run: |
          set -o pipefail
          ./gradlew :apps:edit:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Verify editor APK identity (edit-debug)
        if: matrix.editor_target == 'edit-debug'
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)"
          if [ -z "$AAPT2" ]; then echo "::error::aapt2 not found under $SDK_ROOT/build-tools"; exit 1; fi
          APK="$(ls apps/edit/build/outputs/apk/debug/*.apk)"
          EXPECTED_VC="$(grep -m1 -oE 'versionCode = [0-9]+' apps/edit/build.gradle.kts | grep -oE '[0-9]+' | head -1)"
          if [ -z "$EXPECTED_VC" ]; then echo "::error::could not derive versionCode from apps/edit/build.gradle.kts"; exit 1; fi
          BADGE="$("$AAPT2" dump badging "$APK" | head -1)"
          echo "badging: $BADGE"
          echo "derived expected versionCode: $EXPECTED_VC"
          echo "$BADGE" | grep -q "name='io.github.dukeoftoad.gallery.edit.debug'" \
            || { echo "::error::unexpected application id (expected the .debug variant)"; exit 1; }
          echo "$BADGE" | grep -q "versionCode='$EXPECTED_VC'" \
            || { echo "::error::unexpected versionCode (expected $EXPECTED_VC, derived from the checkout)"; exit 1; }

      - name: Stage the editor debug APK (edit-debug)
        if: matrix.editor_target == 'edit-debug'
        run: |
          APK="$(ls apps/edit/build/outputs/apk/debug/*.apk)"
          VERSION_NAME="$(grep -m1 -oE 'versionName = "[^"]+"' apps/edit/build.gradle.kts | sed -e 's/versionName = //' -e 's/"//g')"
          if [ -z "$VERSION_NAME" ]; then echo '::error::could not derive versionName from apps/edit/build.gradle.kts'; exit 1; fi
          STAGE="$RUNNER_TEMP/edit-apk-staging"
          mkdir -p "$STAGE"
          APK_NAME="toadGALLERY-Edit-${VERSION_NAME}-debug.apk"
          cp "$APK" "$STAGE/$APK_NAME"
          ( cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          ls -la "$STAGE"
          echo "EDITOR_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "EDITOR_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload the editor debug APK artifact (edit-debug)
        if: matrix.editor_target == 'edit-debug'
        uses: actions/upload-artifact@v4
        with:
          name: toadGALLERY-Edit-${{ env.EDITOR_VERSION_NAME }}-debug
          path: ${{ runner.temp }}/edit-apk-staging/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --- leg: edit-release (unsigned R8/compile gate, BY DESIGN) -----------
      - name: Assemble the editor release APK — unsigned by design
        if: matrix.editor_target == 'edit-release'
        run: |
          set -o pipefail
          # The editor's release build type declares no signing config
          # (apps/edit/build.gradle.kts) and ADR-0018 keeps release signing in
          # release.yml only --- this leg is the R8/compile gate; the artifact
          # below is an UNSIGNED QA build, never for publishing.
          ./gradlew :apps:edit:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Stage the unsigned editor release APK (edit-release)
        if: matrix.editor_target == 'edit-release'
        run: |
          APK="$(ls apps/edit/build/outputs/apk/release/*.apk)"
          case "$APK" in
            *unsigned*) : ;; # the expected unsigned output
            *) echo "::warning::release APK does not carry the -unsigned suffix ($APK) --- verify no signing config leaked into :apps:edit" ;;
          esac
          VERSION_NAME="$(grep -m1 -oE 'versionName = "[^"]+"' apps/edit/build.gradle.kts | sed -e 's/versionName = //' -e 's/"//g')"
          STAGE="$RUNNER_TEMP/edit-apk-staging"
          mkdir -p "$STAGE"
          APK_NAME="toadGALLERY-Edit-${VERSION_NAME}-release-UNSIGNED.apk"
          cp "$APK" "$STAGE/$APK_NAME"
          ( cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          ls -la "$STAGE"
          echo "EDITOR_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Upload the unsigned editor release artifact (edit-release)
        if: matrix.editor_target == 'edit-release'
        uses: actions/upload-artifact@v4
        with:
          name: toadGALLERY-Edit-${{ env.EDITOR_VERSION_NAME }}-release-UNSIGNED
          path: ${{ runner.temp }}/edit-apk-staging/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --- leg: contract (the shared module both apps must agree on) ---------
      - name: Build + test the shared editor contract module
        if: matrix.editor_target == 'contract'
        run: |
          set -o pipefail
          ./gradlew :shared:editor-contract:assemble :shared:editor-contract:test --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Upload the contract jar artifact (contract)
        if: matrix.editor_target == 'contract'
        uses: actions/upload-artifact@v4
        with:
          name: editor-contract-jar
          path: shared/editor-contract/build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --- per-leg diagnostics + summary --------------------------------------
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-apk-build-logs-${{ matrix.editor_target }}-${{ github.run_id }}
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary (this matrix leg)
        if: always()
        run: |
          {
            echo "## Editor APK build — include all · leg \`${{ matrix.editor_target }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Trigger variant | \`${{ github.event.inputs.build_variant }}\` |"
            if [ -n "$EDITOR_VERSION_NAME" ]; then
              echo "| Editor versionName | \`$EDITOR_VERSION_NAME\` |"
            fi
            case "${{ matrix.editor_target }}" in
              edit-debug)   echo "| Artifact | \`toadGALLERY-Edit-${EDITOR_VERSION_NAME:-?}-debug\` (debug key) |" ;;
              edit-release) echo "| Artifact | \`toadGALLERY-Edit-${EDITOR_VERSION_NAME:-?}-release-UNSIGNED\` (unsigned by ADR-0018 — QA only) |" ;;
              contract)     echo "| Artifact | \`editor-contract-jar\` (JVM tests included) |" ;;
            esac
            echo ""
            echo "Editor targets covered by this workflow: edit-debug · edit-release · contract (all editor surfaces; the editor has no product flavors)."
          } >> "$GITHUB_STEP_SUMMARY"
