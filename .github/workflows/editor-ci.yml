name: Editor CI

# Phase 2 branch isolation --- the editor integration branch builds ONLY
# the standalone editor APK. Editor-side changes (the editor modules, the
# shared contract, the Gradle catalog) trigger this workflow; unrelated
# changes do not.

on:
  push:
    branches: [ editor ]
    paths:
      - 'editor/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/editor-ci.yml'
      - '.github/actions/toad-setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-apk:
    name: Editor debug APK + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the toolchain (Android)
        uses: ./.github/actions/toad-setup

      - name: Build editor debug APK
        run: ./gradlew :editor:app:assembleDebug --no-daemon --stacktrace

      - name: Run editor lint
        run: ./gradlew :editor:app:lintDebug --no-daemon --stacktrace

      # :shared:video-edit joins the lane --- the editor is the pure
      # module's primary consumer, and its suite (VideoEditPlan,
      # ClipTimeline) had no other workflow gate.
      - name: Run editor + contract + video-edit unit tests
        run: ./gradlew :editor:app:testDebugUnitTest :shared:editor-contract:test :shared:video-edit:test --no-daemon --stacktrace

      # The FULL :editor:core unit suite runs here: the Roborazzi PR gates
      # rest (screenshots.yml is manual-dispatch only), so the screenshot
      # classes ride along as no-op captures (the plugin skips
      # captureRoboImage() outside the roborazzi task graph). Assemble,
      # lint debug, and this unit lane are the editor's gates;
      # instrumented E2E is F-75.
      - name: Run the full editor core unit suite
        run: ./gradlew :editor:core:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload editor APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: editor-debug-apk
          path: editor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: editor-lint-reports
          path: editor/app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14
