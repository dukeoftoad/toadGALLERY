name: Editor CI

# Phase 2 branch isolation --- the editor integration branch builds ONLY
# the standalone editor APK. Editor-side changes (the editor modules, the
# shared contract, the Gradle catalog) trigger this workflow; gallery and unrelated feature changes do not. The editor branch contributes
# to unified through a reviewed PR; unified validates the integrated product family.

on:
  push:
    branches: [ editor ]
    paths:
      - 'editor/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/editor-ci.yml'
      - '.github/actions/toad-setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-apk:
    name: Editor debug APK + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the toolchain (Android)
        uses: ./.github/actions/toad-setup

      - name: Build editor debug APK
        run: ./gradlew :editor:app:assembleDebug --no-daemon --stacktrace

      - name: Run editor lint
        run: ./gradlew :editor:app:lintDebug --no-daemon --stacktrace

      - name: Run editor + contract unit tests
        run: ./gradlew :editor:app:testDebugUnitTest :shared:editor-contract:test --no-daemon --stacktrace

      # r67 (the Lilypad foundation round): the design system's JVM-pinned
      # tests gate CI. The filter runs ONLY the Lilypad-prefixed classes
      # (LilypadTokensTest, LilypadSliderMathTest, LilypadDeckMathTest) ---
      # the module's Roborazzi screenshot tests stay out of CI exactly as
      # before (baselines record in the deliberate local/record pass, not
      # on runners), and the r30-r66 legacy core tests keep their local
      # contract until the coverage round widens the net.
      - name: Run the Lilypad token tests
        run: ./gradlew :editor:core:testDebugUnitTest --tests 'com.toadgallery.editor.Lilypad*' --no-daemon --stacktrace

      - name: Upload editor APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: editor-debug-apk
          path: editor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: editor-lint-reports
          path: editor/app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14
