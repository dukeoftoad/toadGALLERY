name: Engine APK (test build)

# toadGALLERY --- isolated engine-enabled TEST APK build (2026-11-03 session).
#
# Maintainer directive (2026-11-03, isolated-work session; identity and
# staging generalized 2026-11-03 after the build-30 cut): build the
# engine-enabled DEBUG APK for on-device dogfood validation (the
# pending Phase 5 r24/r25 dogfood items in tasks.md + the device-validation
# checklist sections) on a dedicated branch that touches NO source, NO
# docs, and NO shared workflow --- zero file overlap with the parallel
# Magic Search round, so no merge conflicts are possible. The branch is a
# byte-identical copy of main (r25, versionCode 29): ente AI/ML engine,
# EXIF metadata layer, timelines, search, People UI, background queue.
#
# Why a separate file (not a ci.yml edit): ci.yml is the canonical CI
# (ADR-0013) and the parallel round is expected to touch it; this workflow
# is branch-scoped and purely additive. It replicates ci.yml's
# engine-android job VERBATIM (same pins, same cache keys, same
# native-library gate) plus exactly two additions: the APK identity check
# and the artifact upload. ci.yml's engine-android job on main keeps its
# zero-upload directive --- this is a TEST-BRANCH pipeline, not a release:
# no tag is cut, no GitHub Release is created (the Phase 5 release freeze
# stands), debug key only (same shape as the r23 device artifact).
#
# Triggers: pushes to tg-engine-apk-* branches and manual dispatch.
#
# r46 (the APK-matrix round): the engine-enabled build is the ENGINE FLAVOR
# (:apps:gallery:assembleEngineDebug --- applicationIdSuffix .engine, so the
# debug artifact installs as io.github.dukeoftoad.gallery.engine.debug), and
# the output paths are flavor-qualified (apk/engine/debug/).

on:
  push:
    branches: [ 'tg-engine-apk-*' ]
  workflow_dispatch:

concurrency:
  group: engine-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-apk:
    name: Engine-enabled debug APK (arm64-v8a) + artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # F-2 (follow-up 2026-11-04): the canonical toolchain setup now lives
      # in .github/actions/toad-setup --- the full engine-cross shape (Rust +
      # aarch64 target + the android cargo cache + cargo-ndk + the NDK
      # resolve + the whole Android side), same pins, same cache keys (the
      # warm caches from main's CI restore here unchanged).
      - name: Set up the toolchain (Rust Android cross + Android)
        uses: ./.github/actions/toad-setup
        with:
          rust: android

      # Verbatim from ci.yml's engine-android job: -PwithEngine registers
      # the buildRustEngine Exec task; its preBuild dependency runs
      # engine/scripts/build-android.sh (idempotent): cargo-ndk builds
      # libtoad_ml_jni.so + stages the sha256-pinned libonnxruntime.so
      # (ORT 1.31.0 official AAR) for arm64-v8a into
      # apps/gallery/build/rust-jniLibs/, which the jniLibs srcDir packages.
      - name: Engine-enabled debug assemble (arm64-v8a)
        run: ./gradlew :apps:gallery:assembleEngineDebug -PwithEngine --no-daemon --stacktrace

      # Verbatim gate from ci.yml's engine-android job: the engine-enabled
      # APK must actually carry BOTH native libraries (a silently broken
      # jniLibs wiring would otherwise pass the assemble step).
      # r46: the ENGINE flavor's output dir (apk/engine/debug/).
      - name: Verify the native libraries are packaged
        run: |
          APK="$(ls apps/gallery/build/outputs/apk/engine/debug/*.apk)"
          echo "APK: $APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libtoad_ml_jni.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libonnxruntime.so"

      # Test-build addition 1: pin the APK's identity in the log and fail
      # the build on any mismatch, so a wrong variant or version can never
      # be delivered as the branch's dogfood artifact. Generalized
      # 2026-11-03 (the hardcoded 29 broke the build-30 cut after r26
      # merged): the expected versionCode is DERIVED from the checkout's
      # own build.gradle.kts.
      - name: Verify APK identity (package + the checkout's versionCode)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)"
          [ -n "$AAPT2" ] || { echo "::error::aapt2 not found under $SDK_ROOT/build-tools"; exit 1; }
          APK="$(ls apps/gallery/build/outputs/apk/engine/debug/*.apk)"
          EXPECTED_VC="$(grep -m1 -oE 'versionCode = [0-9]+' apps/gallery/build.gradle.kts | grep -oE '[0-9]+' | head -1)"
          [ -n "$EXPECTED_VC" ] || { echo "::error::could not derive versionCode from apps/gallery/build.gradle.kts"; exit 1; }
          BADGE="$("$AAPT2" dump badging "$APK" | head -1)"
          echo "badging: $BADGE"
          echo "derived expected versionCode: $EXPECTED_VC"
          echo "$BADGE" | grep -q "name='io.github.dukeoftoad.gallery.engine.debug'" \
            || { echo "::error::unexpected application id (expected the .engine.debug variant)"; exit 1; }
          echo "$BADGE" | grep -q "versionCode='$EXPECTED_VC'" \
            || { echo "::error::unexpected versionCode (expected $EXPECTED_VC, derived from the checkout)"; exit 1; }

      # Test-build addition 2: stage under the r23-convention name and
      # upload as a workflow artifact. NOT a release: no tag is cut and the
      # Phase 5 release freeze stands; debug key only, exactly like the r23
      # device artifact. Generalized 2026-11-03 (the hardcoded r25 name
      # broke the build-30 cut): versionName comes from the checkout's
      # build.gradle.kts; the rNN tag comes from the round comment that
      # owns the current versionCode.
      - name: Stage the APK (r23-convention name, derived)
        run: |
          APK="$(ls apps/gallery/build/outputs/apk/engine/debug/*.apk)"
          EXPECTED_VC="$(grep -m1 -oE 'versionCode = [0-9]+' apps/gallery/build.gradle.kts | grep -oE '[0-9]+' | head -1)"
          VERSION_NAME="$(grep -m1 -oE 'versionName = "[^"]+"' apps/gallery/build.gradle.kts | sed -e 's/versionName = //' -e 's/"//g')"
          LAST_ROUND="$(grep -oE 'versionCode [0-9]+ .r[0-9]+ round' apps/gallery/build.gradle.kts | tail -1 || true)"
          RNN="$(printf '%s' "$LAST_ROUND" | grep -oE 'r[0-9]+' || true)"
          ROUND_VC="$(printf '%s' "$LAST_ROUND" | grep -oE '[0-9]+' | head -1)"
          [ -n "$VERSION_NAME" ] || { echo '::error::could not derive versionName'; exit 1; }
          [ -n "$RNN" ] || { echo '::error::could not derive the rNN tag from the last round comment'; exit 1; }
          [ "$ROUND_VC" = "$EXPECTED_VC" ] || { echo "::error::the last round comment does not own versionCode $EXPECTED_VC ($LAST_ROUND)"; exit 1; }
          echo "RNN=$RNN" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          STAGED="toadGALLERY-${VERSION_NAME}-${RNN}-engine-debug.apk"
          echo "staged name: $STAGED"
          mkdir -p engine-apk-staging
          cp "$APK" "engine-apk-staging/$STAGED"
          ls -la engine-apk-staging/
          sha256sum engine-apk-staging/*.apk

      - name: Upload engine APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toadGALLERY-${{ env.VERSION_NAME }}-${{ env.RNN }}-engine-debug
          path: engine-apk-staging/toadGALLERY-${{ env.VERSION_NAME }}-${{ env.RNN }}-engine-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
