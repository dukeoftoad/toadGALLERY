name: Ente CI

# Ente is an occasional upstream synchronization lane, not a fifth product.
# This workflow validates reviewed upstream changes staged on ente before
# their contribution is proposed to unified. It checks the vendored engine
# and the Gallery Engine integration build.
#
# Path filter: engine sources + Gallery Engine wiring + Gradle/toolchain
# files. This is intentionally push/manual validation for upstream syncs;
# it is not a daily release lane.

on:
  push:
    branches: [ ente ]
    paths:
      - 'engine/**'
      - 'gallery/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ente-ci.yml'
      - '.github/actions/toad-setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ente-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Vendored engine (cargo check + fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the toolchain (Rust host gates)
        uses: ./.github/actions/toad-setup
        with:
          rust: host
          android: 'false'

      - name: cargo check
        working-directory: engine
        run: cargo check --workspace --all-targets

      - name: cargo fmt
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: engine
        run: cargo clippy --workspace

      - name: cargo test (photos-side crates)
        working-directory: engine
        run: cargo test -p ente-vecdb -p ente-photos-ml

  engine-apk:
    name: Engine-enabled gallery APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the toolchain (Rust Android cross + Android)
        uses: ./.github/actions/toad-setup
        with:
          rust: android

      - name: Engine-enabled debug assemble (arm64-v8a)
        run: ./gradlew :gallery:app:assembleEngineDebug -PwithEngine --no-daemon --stacktrace

      - name: Verify the native libraries are packaged
        run: |
          APK="$(ls gallery/app/build/outputs/apk/engine/debug/*.apk)"
          echo "APK: $APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libtoad_ml_jni.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libonnxruntime.so"

      - name: Upload engine-enabled gallery APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gallery-engine-debug-apk
          path: gallery/app/build/outputs/apk/engine/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
