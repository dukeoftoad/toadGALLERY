name: Stable branch verification (four products)

# Post-merge verification for main. main receives only approved stable
# promotions from unified. This workflow builds the four-product family;
# it does not publish a release. Stable publication is release-main.yml.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine-host:
    name: Vendored engine host checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Rust host toolchain
        uses: ./.github/actions/toad-setup
        with:
          rust: host
          android: false
      - name: cargo check
        working-directory: engine
        run: cargo check --workspace --all-targets
      - name: cargo fmt
        working-directory: engine
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: engine
        run: cargo clippy --workspace
      - name: cargo test (photos-side crates)
        working-directory: engine
        run: cargo test -p ente-vecdb -p ente-photos-ml

  products:
    name: Build ${{ matrix.product }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: Basic Gallery
            task: :gallery:app:assembleBasicDebug
            artifact: gallery/app/build/outputs/apk/basic/debug/*.apk
            rust: ''
            with_engine: false
            native: false
          - product: Gallery Engine
            task: :gallery:app:assembleEngineDebug
            artifact: gallery/app/build/outputs/apk/engine/debug/*.apk
            rust: android
            with_engine: true
            native: true
          - product: Editor
            task: :editor:app:assembleDebug
            artifact: editor/app/build/outputs/apk/debug/*.apk
            rust: ''
            with_engine: false
            native: false
          - product: Unified
            task: :unified:app:assembleDebug
            artifact: unified/app/build/outputs/apk/debug/*.apk
            rust: android
            with_engine: true
            native: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up toolchain
        uses: ./.github/actions/toad-setup
        with:
          rust: ${{ matrix.rust }}
      - name: Assemble ${{ matrix.product }}
        run: ./gradlew ${{ matrix.task }} ${{ matrix.with_engine && '-PwithEngine' || '' }} --no-daemon --stacktrace
      - name: Verify APK exists
        env:
          APK_GLOB: ${{ matrix.artifact }}
        run: |
          APK="$(find "$(dirname "$APK_GLOB")" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "Verified artifact: $APK"
      - name: Verify native libraries (Engine and Unified)
        if: matrix.native
        env:
          APK_GLOB: ${{ matrix.artifact }}
        run: |
          APK="$(find "$(dirname "$APK_GLOB")" -maxdepth 1 -name '*.apk' -print -quit)"
          unzip -l "$APK" | grep "lib/arm64-v8a/libtoad_ml_jni.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libonnxruntime.so"
      - name: Verify Basic Gallery excludes engine native libraries
        if: matrix.product == 'Basic Gallery'
        env:
          APK_GLOB: ${{ matrix.artifact }}
        run: |
          APK="$(find "$(dirname "$APK_GLOB")" -maxdepth 1 -name '*.apk' -print -quit)"
          for LIB in lib/arm64-v8a/libtoad_ml_jni.so lib/arm64-v8a/libonnxruntime.so; do
            if unzip -l "$APK" | grep -q "$LIB"; then
              echo "::error::Basic Gallery must not package $LIB"
              exit 1
            fi
          done
      - name: Upload ${{ matrix.product }} APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: main-${{ matrix.product }}-debug-apk
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
