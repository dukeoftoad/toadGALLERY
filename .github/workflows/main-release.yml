name: Main release (5-APK matrix)

# Phase 2 branch isolation --- the main branch builds ALL 5 APKs of the
# toadGALLERY family on every push (merge). This is the authoritative
# release-verification build: the 4 gallery flavors (basic, engine,
# semantic, face) + the unified app. The standalone editor APK is verified
# on the editor branch (the Virtual Fork isolation); it is NOT rebuilt
# here.
#
# This workflow takes over the push-to-main trigger from ci.yml (which
# becomes PR-only after Phase 2). ci.yml stays the canonical PR gate
# (engine cargo gates + 1 basic APK + editor + unified compile + unit
# tests); this workflow is the post-merge 5-APK release build.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine-gates:
    name: Vendored engine (cargo check + fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the toolchain (Rust host gates)
        uses: ./.github/actions/toad-setup
        with:
          rust: host
          android: 'false'

      - name: cargo check
        working-directory: engine
        run: cargo check --workspace --all-targets

      - name: cargo fmt
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: engine
        run: cargo clippy --workspace

  gallery:
    name: Gallery ${{ matrix.flavor }} debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: Basic
            task: :gallery:app:assembleBasicDebug
            with_engine: false
            rust: ''
          - flavor: Engine
            task: :gallery:app:assembleEngineDebug
            with_engine: true
            rust: android
          - flavor: Semantic
            task: :gallery:app:assembleSemanticDebug
            with_engine: true
            rust: android
          - flavor: Face
            task: :gallery:app:assembleFaceDebug
            with_engine: true
            rust: android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the toolchain
        uses: ./.github/actions/toad-setup
        with:
          rust: ${{ matrix.rust }}

      - name: Assemble ${{ matrix.flavor }} debug APK
        run: ./gradlew ${{ matrix.task }} ${{ matrix.with_engine && '-PwithEngine' || '' }} --no-daemon --stacktrace

      - name: Verify native libraries are packaged (engine flavors only)
        if: matrix.with_engine
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          FLAVOR_LC="$(echo "$FLAVOR" | tr '[:upper:]' '[:lower:]')"
          APK="$(ls gallery/app/build/outputs/apk/$FLAVOR_LC/debug/*.apk)"
          echo "APK: $APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libtoad_ml_jni.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libonnxruntime.so"

      - name: Upload ${{ matrix.flavor }} APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: main-gallery-${{ matrix.flavor }}-debug-apk
          path: gallery/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  unified:
    name: Unified debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the toolchain (Rust Android cross + Android)
        uses: ./.github/actions/toad-setup
        with:
          rust: android

      - name: Assemble Unified debug APK
        run: ./gradlew :unified:app:assembleDebug -PwithEngine --no-daemon --stacktrace

      - name: Verify native libraries are packaged
        run: |
          APK="$(ls unified/app/build/outputs/apk/debug/*.apk)"
          echo "APK: $APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libtoad_ml_jni.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libonnxruntime.so"

      - name: Upload Unified APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: main-unified-debug-apk
          path: unified/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
