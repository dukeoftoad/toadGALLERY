name: Release (editor --- the companion editor APK)

# Phase 3 manual release pipelines --- the editor fork's single-APK
# release. ABSOLUTE CONTROL: workflow_dispatch ONLY, zero automated
# triggers (push / tags / schedule).
#
# Ref pinning (the PR #164 wrong-baseline lesson): the checkout pins the
# editor branch --- the ref this workflow is dispatched from is ignored
# by design, so release-editor always releases the editor fork tip.
#
# ADR-0018: the APK is release-key signed via the TG_* secrets contract
# and passes the HARD apksigner gate (pinned signer digest) before it
# publishes; the APK is the ONLY release asset --- the R8 mapping.txt
# and the checksum ride the run's Actions artifact (rel-editor), not
# the release page. The editor's release-variant privacy gate (NO
# INTERNET in the merged manifest, no allowlist) runs transitively
# via assembleRelease (ADR-0014), so every published editor APK is
# offline-by-construction.
# No Rust toolchain: the editor embeds no native engine.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The release tag, e.g. v0.4.14-edit-alpha-r50 (required). A trailing -r<N> drives the asset file names; otherwise the run number is used.'
        type: string
        required: true
      prerelease:
        description: 'Mark the release as a pre-release (default; the stable v1.0 cut is a human decision per ADR-0018).'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-editor
  cancel-in-progress: false

jobs:
  release:
    name: Build + publish the Editor APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: 'Checkout (pinned: editor)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: editor

      - name: Set up the toolchain (Android --- no Rust, the editor embeds no engine)
        uses: ./.github/actions/toad-setup

      - name: Decode the ADR-0018 release keystore
        env:
          TG_RELEASE_KEYSTORE_BASE64: ${{ secrets.TG_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$TG_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/toadgallery-release.jks"
          chmod 600 "$RUNNER_TEMP/toadgallery-release.jks"
          if [[ ! -s "$RUNNER_TEMP/toadgallery-release.jks" ]]; then
            echo "::error::decoded keystore is empty --- is TG_RELEASE_KEYSTORE_BASE64 set (ADR-0018)?"
            exit 1
          fi

      - name: Resolve the tag, the round and the version
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ -z "$TAG_NAME" || "$TAG_NAME" =~ [[:space:]] ]]; then
            echo "::error::tag_name is required and must not contain whitespace"
            exit 1
          fi
          if [[ "$TAG_NAME" =~ -r([0-9]+)$ ]]; then
            ROUND="${BASH_REMATCH[1]}"
          else
            ROUND="$GITHUB_RUN_NUMBER"
          fi
          VERSION_EDITOR="$(grep -oP 'versionName = "\K[^"]+' editor/app/build.gradle.kts | tail -n1)"
          if [[ -z "$VERSION_EDITOR" ]]; then
            echo "::error::could not extract versionName from editor/app/build.gradle.kts"
            exit 1
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "tag=$TAG_NAME round=$ROUND editor=$VERSION_EDITOR sha=$RELEASE_SHA"
          {
            echo "TAG_NAME=$TAG_NAME"
            echo "ROUND=$ROUND"
            echo "VERSION_EDITOR=$VERSION_EDITOR"
            echo "RELEASE_SHA=$RELEASE_SHA"
          } >> "$GITHUB_ENV"

      - name: Build the signed Editor APK
        env:
          TG_KEYSTORE_FILE: ${{ runner.temp }}/toadgallery-release.jks
          TG_KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          TG_KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          TG_KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :editor:app:assembleRelease --no-daemon --stacktrace

      - name: Verify the Editor APK (hard signature gate)
        run: |
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/apksigner"
          if [[ ! -x "$APKSIGNER" ]]; then
            APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -path '*36.0.0*/apksigner' -print -quit)"
          fi
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner not found under build-tools 36.0.0"
            exit 1
          fi
          EXPECTED_SHA256="8a4640e0732e28b84c2fa35ee7a350d104ce97d87df92262cc8439832bd29494"
          APK_DIR="editor/app/build/outputs/apk/release"
          SIGNED_APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*unsigned*' -print -quit)"
          if [[ -z "$SIGNED_APK" ]]; then
            echo "::error::no signed release APK in $APK_DIR (unsigned present: $(find "$APK_DIR" -maxdepth 1 -name '*unsigned*.apk' -print -quit || echo none)) --- the build did not sign; check the TG_* env contract (ADR-0018)"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$SIGNED_APK" > "$RUNNER_TEMP/editor-apk-certs.txt"
          cat "$RUNNER_TEMP/editor-apk-certs.txt"
          ACTUAL_SHA256="$(grep -oP 'Signer #1 certificate SHA-256 digest: \K[0-9a-fA-F]+' "$RUNNER_TEMP/editor-apk-certs.txt" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$ACTUAL_SHA256" ]]; then
            echo "::error::editor: apksigner reported no signer certificate --- signature did not verify"
            exit 1
          fi
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::editor signer mismatch: expected $EXPECTED_SHA256, got $ACTUAL_SHA256 --- NOT the ADR-0018 release key; refusing to publish"
            exit 1
          fi
          echo "editor signature gate OK --- $SIGNED_APK"
          if unzip -l "$SIGNED_APK" | grep -q "lib/arm64-v8a/libtoad_ml_jni.so"; then
            echo "::error::the EDITOR APK must NOT carry the engine native library"
            exit 1
          fi
          echo "EDITOR_APK=$SIGNED_APK" >> "$GITHUB_ENV"

      - name: Stage the release artifacts
        run: |
          STAGE="$GITHUB_WORKSPACE/staging"
          mkdir -p "$STAGE"
          NAME="toadGALLERY-editor-${VERSION_EDITOR}-r${ROUND}"
          cp "$EDITOR_APK" "$STAGE/$NAME.apk"
          MAP="editor/app/build/outputs/mapping/release/mapping.txt"
          if [[ ! -s "$MAP" ]]; then
            echo "::error::no R8 mapping at $MAP --- the mapping lineage is mandatory on a release"
            exit 1
          fi
          cp "$MAP" "$STAGE/$NAME-mapping.txt"
          ( cd "$STAGE" && for f in ./*.apk; do sha256sum "$f" > "$f.sha256"; done )
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          ls -l "$STAGE"

      - name: Upload the staged release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rel-editor
          path: staging/*
          if-no-files-found: warn
          retention-days: 14

      - name: Guard --- the tag and the release must not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "refs/tags/${TAG_NAME}"; then
            echo "::error::tag ${TAG_NAME} already exists on origin --- pick a new tag (a release tag is never reused)"
            exit 1
          fi
          if gh release view "$TAG_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::a GitHub release named ${TAG_NAME} already exists --- pick a new tag"
            exit 1
          fi
          echo "tag guard OK --- ${TAG_NAME} is fresh"

      - name: Compose the release notes
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "**toadGALLERY Editor --- the companion editor APK, release ${TAG_NAME}.**"
            echo ""
            echo "Built from the editor fork tip (editor @ ${RELEASE_SHA}), version ${VERSION_EDITOR}."
            echo ""
            echo "- applicationId com.toadgallery.editor; install it alongside ANY gallery flavor."
            echo "- Offline-by-construction: the editor's merged manifest carries NO INTERNET (the privacy gate has no allowlist and fails the build otherwise, ADR-0014)."
            echo "- Signed with the ADR-0018 release key; verify with apksigner verify --- the signer certificate SHA-256 must be 8a4640e0732e28b84c2fa35ee7a350d104ce97d87df92262cc8439832bd29494."
            echo "- Built by the manual release-editor pipeline (workflow_dispatch only, no automated triggers); dispatch run ${GITHUB_RUN_ID}."
          } > "$NOTES"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            "${ARGS[@]}" \
            --target "$RELEASE_SHA" \
            --title "toadGALLERY Editor ${TAG_NAME}" \
            --notes-file "$NOTES" \
            "$STAGE"/*.apk
          gh release view "$TAG_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
