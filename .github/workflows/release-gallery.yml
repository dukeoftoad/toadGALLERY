name: Release (gallery --- Basic | Engine | both)

# Phase 3 manual release pipelines --- the gallery fork's release. The
# dispatch input makes the operator choose the Basic APK, the Engine APK,
# or BOTH. ABSOLUTE CONTROL: workflow_dispatch ONLY, zero automated
# triggers (push / tags / schedule).
#
# Ref pinning (the PR #164 wrong-baseline lesson): the checkout pins the
# gallery branch --- the ref this workflow is dispatched from is ignored
# by design, so release-gallery always releases the gallery fork tip.
#
# TWO gradle invocations when BOTH is chosen, deliberately (the r46
# lesson): -PwithEngine is a GLOBAL property --- one invocation would
# package the engine native libraries into the basic APK. The negative
# packaging gate below hard-verifies basic carries no engine library and
# engine carries both.
#
# ADR-0018: the APKs are release-key signed via the TG_* secrets contract
# and pass the HARD apksigner gate (pinned signer digest) before they
# publish; the APKs are the ONLY release assets --- the checksums and
# the R8 mapping.txt of every built APK ride the run's Actions artifact
# (rel-gallery), not the release page.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'basic = the offline-first core gallery (no native code). engine = the engine-enabled gallery (-PwithEngine). both = the two-invocation matrix build.'
        type: choice
        options: [ basic, engine, both ]
        default: basic
        required: true
      tag_name:
        description: 'The release tag, e.g. v0.4.5-alpha-r50 (required). A trailing -r<N> drives the asset file names; otherwise the run number is used.'
        type: string
        required: true
      prerelease:
        description: 'Mark the release as a pre-release (default; the stable v1.0 cut is a human decision per ADR-0018).'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-gallery
  cancel-in-progress: false

jobs:
  release:
    name: Build + publish the Gallery APK(s) (${{ inputs.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      VARIANT: ${{ inputs.variant }}
    steps:
      - name: 'Checkout (pinned: gallery)'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gallery

      # 'none' is not a toad-setup rust mode and skips every Rust step ---
      # the composite only fires its Rust blocks on exactly 'host' or
      # 'android'.
      - name: Set up the toolchain (Rust Android cross + Android when the engine leg runs)
        uses: ./.github/actions/toad-setup
        with:
          rust: ${{ inputs.variant != 'basic' && 'android' || 'none' }}

      - name: Decode the ADR-0018 release keystore
        env:
          TG_RELEASE_KEYSTORE_BASE64: ${{ secrets.TG_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$TG_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/toadgallery-release.jks"
          chmod 600 "$RUNNER_TEMP/toadgallery-release.jks"
          if [[ ! -s "$RUNNER_TEMP/toadgallery-release.jks" ]]; then
            echo "::error::decoded keystore is empty --- is TG_RELEASE_KEYSTORE_BASE64 set (ADR-0018)?"
            exit 1
          fi

      - name: Resolve the tag, the round and the version
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ -z "$TAG_NAME" || "$TAG_NAME" =~ [[:space:]] ]]; then
            echo "::error::tag_name is required and must not contain whitespace"
            exit 1
          fi
          if [[ "$TAG_NAME" =~ -r([0-9]+)$ ]]; then
            ROUND="${BASH_REMATCH[1]}"
          else
            ROUND="$GITHUB_RUN_NUMBER"
          fi
          VERSION_GALLERY="$(grep -oP 'versionName = "\K[^"]+' gallery/app/build.gradle.kts | head -n1)"
          if [[ -z "$VERSION_GALLERY" ]]; then
            echo "::error::could not extract versionName from gallery/app/build.gradle.kts"
            exit 1
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "tag=$TAG_NAME round=$ROUND gallery=$VERSION_GALLERY variant=$VARIANT sha=$RELEASE_SHA"
          {
            echo "TAG_NAME=$TAG_NAME"
            echo "ROUND=$ROUND"
            echo "VERSION_GALLERY=$VERSION_GALLERY"
            echo "RELEASE_SHA=$RELEASE_SHA"
          } >> "$GITHUB_ENV"

      # Invocation 1: PROPERTY-LESS (the basic flavor). Runs for basic and
      # both. Never add -PwithEngine here (the negative packaging gate
      # below hard-verifies that).
      - name: Build the signed Basic APK (property-less)
        if: env.VARIANT == 'basic' || env.VARIANT == 'both'
        env:
          TG_KEYSTORE_FILE: ${{ runner.temp }}/toadgallery-release.jks
          TG_KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          TG_KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          TG_KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :gallery:app:assembleBasicRelease --no-daemon --stacktrace

      # Invocation 2: -PwithEngine (the engine flavor). Runs for engine
      # and both. The buildRustEngine Exec task stages
      # libtoad_ml_jni.so + libonnxruntime.so into the module's
      # build/rust-jniLibs srcDir.
      - name: Build the signed Engine APK (-PwithEngine)
        if: env.VARIANT == 'engine' || env.VARIANT == 'both'
        env:
          TG_KEYSTORE_FILE: ${{ runner.temp }}/toadgallery-release.jks
          TG_KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          TG_KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          TG_KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :gallery:app:assembleEngineRelease -PwithEngine --no-daemon --stacktrace

      - name: Verify the built APKs (signature + packaging gates)
        run: |
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/apksigner"
          if [[ ! -x "$APKSIGNER" ]]; then
            APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -path '*36.0.0*/apksigner' -print -quit)"
          fi
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner not found under build-tools 36.0.0"
            exit 1
          fi
          EXPECTED_SHA256="8a4640e0732e28b84c2fa35ee7a350d104ce97d87df92262cc8439832bd29494"

          verify_release_signature() {
            local APP_LABEL="$1"
            local APK_DIR="$2"
            if [[ ! -d "$APK_DIR" ]]; then
              echo "::error::$APK_DIR does not exist --- assembleRelease produced no output for $APP_LABEL (variant=$VARIANT)"
              exit 1
            fi
            local SIGNED_APK UNSIGNED_APK
            SIGNED_APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*unsigned*' -print -quit)"
            UNSIGNED_APK="$(find "$APK_DIR" -maxdepth 1 -name '*unsigned*.apk' -print -quit)"
            if [[ -z "$SIGNED_APK" ]]; then
              echo "::error::no signed release APK for $APP_LABEL in $APK_DIR (unsigned present: ${UNSIGNED_APK:-none}) --- the build did not sign; check the TG_* env contract (ADR-0018)"
              exit 1
            fi
            echo "$APP_LABEL release APK: $SIGNED_APK"
            "$APKSIGNER" verify --print-certs "$SIGNED_APK" > "$RUNNER_TEMP/${APP_LABEL}-apk-certs.txt"
            cat "$RUNNER_TEMP/${APP_LABEL}-apk-certs.txt"
            local ACTUAL_SHA256
            ACTUAL_SHA256="$(grep -oP 'Signer #1 certificate SHA-256 digest: \K[0-9a-fA-F]+' "$RUNNER_TEMP/${APP_LABEL}-apk-certs.txt" | tr '[:upper:]' '[:lower:]')"
            if [[ -z "$ACTUAL_SHA256" ]]; then
              echo "::error::$APP_LABEL: apksigner reported no signer certificate --- signature did not verify"
              exit 1
            fi
            if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
              echo "::error::$APP_LABEL signer mismatch: expected $EXPECTED_SHA256, got $ACTUAL_SHA256 --- NOT the ADR-0018 release key; refusing to publish"
              exit 1
            fi
            echo "$APP_LABEL signature gate OK --- signer cert SHA-256 matches the pinned release identity."
            VERIFIED_APK="$SIGNED_APK"
          }

          BUILT_BASIC=false
          BUILT_ENGINE=false
          if [[ "$VARIANT" == "basic" || "$VARIANT" == "both" ]]; then
            verify_release_signature "gallery-basic" "gallery/app/build/outputs/apk/basic/release"
            BASIC_APK="$VERIFIED_APK"
            BUILT_BASIC=true
          fi
          if [[ "$VARIANT" == "engine" || "$VARIANT" == "both" ]]; then
            verify_release_signature "gallery-engine" "gallery/app/build/outputs/apk/engine/release"
            ENGINE_APK="$VERIFIED_APK"
            BUILT_ENGINE=true
          fi

          for LIB in lib/arm64-v8a/libtoad_ml_jni.so lib/arm64-v8a/libonnxruntime.so; do
            if [[ "$BUILT_BASIC" == true ]] && unzip -l "$BASIC_APK" | grep -q "$LIB"; then
              echo "::error::the BASIC gallery APK must NOT carry $LIB --- -PwithEngine leaked into the property-less basic invocation"
              exit 1
            fi
            if [[ "$BUILT_ENGINE" == true ]] && ! unzip -l "$ENGINE_APK" | grep -q "$LIB"; then
              echo "::error::the ENGINE gallery APK must carry $LIB"
              exit 1
            fi
          done
          echo "packaging gates OK --- variant=$VARIANT."
          {
            if [[ "$BUILT_BASIC" == true ]]; then echo "BASIC_APK=$BASIC_APK"; fi
            if [[ "$BUILT_ENGINE" == true ]]; then echo "ENGINE_APK=$ENGINE_APK"; fi
          } >> "$GITHUB_ENV"

      - name: Stage the release artifacts
        run: |
          STAGE="$GITHUB_WORKSPACE/staging"
          mkdir -p "$STAGE"

          if [[ "$VARIANT" == "basic" || "$VARIANT" == "both" ]]; then
            NAME="toadGALLERY-${VERSION_GALLERY}-r${ROUND}"
            cp "$BASIC_APK" "$STAGE/$NAME.apk"
            MAP="gallery/app/build/outputs/mapping/basicRelease/mapping.txt"
            if [[ ! -s "$MAP" ]]; then
              echo "::error::no R8 mapping at $MAP --- the mapping lineage is mandatory on a release"
              exit 1
            fi
            cp "$MAP" "$STAGE/$NAME-mapping.txt"
          fi

          if [[ "$VARIANT" == "engine" || "$VARIANT" == "both" ]]; then
            NAME="toadGALLERY-engine-${VERSION_GALLERY}-r${ROUND}"
            cp "$ENGINE_APK" "$STAGE/$NAME.apk"
            MAP="gallery/app/build/outputs/mapping/engineRelease/mapping.txt"
            if [[ ! -s "$MAP" ]]; then
              echo "::error::no R8 mapping at $MAP --- the mapping lineage is mandatory on a release"
              exit 1
            fi
            cp "$MAP" "$STAGE/$NAME-mapping.txt"
          fi

          ( cd "$STAGE" && for f in ./*.apk; do sha256sum "$f" > "$f.sha256"; done )
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          ls -l "$STAGE"

      - name: Upload the staged release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rel-gallery
          path: staging/*
          if-no-files-found: warn
          retention-days: 14

      - name: Guard --- the tag and the release must not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "refs/tags/${TAG_NAME}"; then
            echo "::error::tag ${TAG_NAME} already exists on origin --- pick a new tag (a release tag is never reused)"
            exit 1
          fi
          if gh release view "$TAG_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::a GitHub release named ${TAG_NAME} already exists --- pick a new tag"
            exit 1
          fi
          echo "tag guard OK --- ${TAG_NAME} is fresh"

      - name: Compose the release notes
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "**toadGALLERY (gallery fork) --- release ${TAG_NAME}, variant ${VARIANT}.**"
            echo ""
            echo "Built from the gallery fork tip (gallery @ ${RELEASE_SHA}), version ${VERSION_GALLERY}."
            echo ""
            if [[ "$VARIANT" == "basic" || "$VARIANT" == "both" ]]; then
              echo "- toadGALLERY-${VERSION_GALLERY}-r${ROUND}.apk --- the BASIC flavor: the offline-first core gallery (timeline, albums, name search, metadata, maps, trash, vault), NO engine library and NO AI surfaces, on the canonical applicationId com.toadgallery."
            fi
            if [[ "$VARIANT" == "engine" || "$VARIANT" == "both" ]]; then
              echo "- toadGALLERY-engine-${VERSION_GALLERY}-r${ROUND}.apk --- the ENGINE flavor: everything basic has PLUS the vendored Ente Rust engine (face clustering AND Magic Search + Things). applicationId com.toadgallery.engine; installs SEPARATELY from basic."
            fi
            echo "- Signed with the ADR-0018 release key; verify with apksigner verify --- the signer certificate SHA-256 must be 8a4640e0732e28b84c2fa35ee7a350d104ce97d87df92262cc8439832bd29494."
            echo "- Requires Android 8.0+ (minSdk 26)."
            echo "- Built by the manual release-gallery pipeline (workflow_dispatch only, no automated triggers); dispatch run ${GITHUB_RUN_ID}."
          } > "$NOTES"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            "${ARGS[@]}" \
            --target "$RELEASE_SHA" \
            --title "toadGALLERY (gallery fork) ${TAG_NAME} --- ${VARIANT}" \
            --notes-file "$NOTES" \
            "$STAGE"/*.apk
          gh release view "$TAG_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
