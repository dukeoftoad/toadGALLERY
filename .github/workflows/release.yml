name: Release

# toadGALLERY release workflow --- issue #59, ADR-0018 (docs/integration-decisions.md)
#
# Dedicated PRE-RELEASE pipeline for SIGNED testing APKs. User directive
# (issue #59): release APKs for pre-release testing must be signed, and they
# are produced by this dedicated release workflow --- not mixed into the
# canonical CI.
#
# Phase 11 shape (r43, the release-engineering round): ONE pipeline, BOTH
# apps. The gallery APK and the edit APK are built, signature-gated and
# published together from the same commit --- the two apps are one product
# (the editor is opened from the gallery via the versioned content-URI
# contract), so the Phase 11 close-out cut ships them as a pair:
#   - Triggers: `v*` tag pushes (cutting a release) and workflow_dispatch
#     (ad-hoc testing pre-releases; empty tag_name input falls back to a
#     computed v<versionName>-r<run_number> default tag).
#   - ADR-0013: ci.yml remains the canonical CI (build/lint/test gating PRs
#     and main). This file does NOT gate PRs and deliberately runs no lint
#     or unit tests --- those are ci.yml's job on green merges; a release is
#     only ever cut from an already-reviewed, already-green SHA.
#   - ADR-0014: the INTERNET privacy gates still run here, transitively ---
#     the release-variant gates anchor on assembleRelease in BOTH
#     apps/gallery/build.gradle.kts and apps/edit/build.gradle.kts, so every
#     published APK is re-verified as offline-by-construction (the editor's
#     merged-manifest gate has no allowlist at all).
#   - ADR-0018: release signing, now for BOTH apps with the SAME release
#     key. The keystore and its credentials live only in GitHub Encrypted
#     Secrets (referenced by name, never committed), and each APK's signer
#     certificate is pinned in its own hard signature gate below, so an
#     unsigned or debug-key APK of either app can never reach a GitHub
#     release.
#   - Artifacts: per-app APK + .sha256 + a clearly-named per-app
#     mapping.txt (a generic mapping.txt is ambiguous across two apps and
#     dozens of releases --- the r43 rename is for better finding).
#   - Still a pre-release per ADR-0018: prerelease + make_latest false,
#     until the v1.0 cut (a human decision, never a workflow default).

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish under. Leave empty to compute v<versionName>-r<run_number> at the built SHA.'
        type: string
        required: false
        default: ''
  push:
    tags: [ 'v*' ]

jobs:
  release:
    name: Build + publish signed pre-release APKs (gallery + edit)
    runs-on: ubuntu-latest
    # 30 was the Phase-0 budget; the r10 Room+KSP round makes the release
    # build longer (R8 now compiles the Room-generated code), and a resource
    # exhaustion hang must still leave room for gradle to print its failure
    # report instead of being killed mid-stack. Since r43 the job builds
    # BOTH apps' release variants (two R8 passes), still inside 45.
    timeout-minutes: 45
    # Creating the tag (dispatch path) and the GitHub release needs write
    # access to repo contents.
    permissions:
      contents: write
    # Release builds are never cancelled mid-flight: a queued run waits for
    # the current publish to finish rather than tearing it down half-way.
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fixed staging dir for the publishable artifact set, exported to
      # GITHUB_ENV from this first runnable step so the always() artifact
      # upload below can reference it even if an earlier step failed.
      # ($RUNNER_TEMP is a shell variable --- the `runner` context is NOT
      # available in job-level `env` expressions, which is why this is a
      # step, not a job env entry.)
      - name: Resolve staging directory
        run: echo "RELEASE_STAGE=$RUNNER_TEMP/release-staging" >> "$GITHUB_ENV"

      # F-2 (follow-up 2026-11-04): the canonical toolchain setup
      # (.github/actions/toad-setup) --- the pure-Android shape (JDK 17 +
      # SDK platform 36/build-tools 36 + the Gradle cache + gradlew chmod;
      # no Rust). The ADR-0018 signing steps below are release.yml's own.
      - name: Set up the toolchain (Android)
        uses: ./.github/actions/toad-setup

      # Both trigger paths funnel into a single TAG_NAME here:
      #   - tag push: the pushed tag (GITHUB_REF_NAME, i.e. github.ref_name)
      #   - dispatch: the tag_name input if non-empty, else the computed
      #     default v<versionName>-r<run_number> (e.g. versionName
      #     "0.4.0-alpha" at run 72 becomes v0.4.0-alpha-r72).
      # VERSION_NAME comes straight from apps/gallery/build.gradle.kts so the
      # tag always agrees with what the gallery APK actually reports.
      # EDIT_VERSION_NAME comes from apps/edit/build.gradle.kts --- the
      # editor carries its OWN version line (the two apps ship and version
      # separately), and that gradle file holds MULTIPLE
      # versionCode/versionName pairs (the append-per-round convention: the
      # LAST assignment wins), so the editor's version is the LAST match
      # where the gallery's is the first.
      - name: Resolve release tag and version names
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          VERSION_NAME="$(grep -oP 'versionName = "\K[^"]+' apps/gallery/build.gradle.kts | head -n1)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "::error::could not extract versionName from apps/gallery/build.gradle.kts"
            exit 1
          fi
          EDIT_VERSION_NAME="$(grep -oP 'versionName = "\K[^"]+' apps/edit/build.gradle.kts | tail -n1)"
          if [[ -z "$EDIT_VERSION_NAME" ]]; then
            echo "::error::could not extract versionName from apps/edit/build.gradle.kts (the last-wins pair)"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          elif [[ -n "$DISPATCH_TAG" ]]; then
            TAG_NAME="$DISPATCH_TAG"
          else
            TAG_NAME="v${VERSION_NAME}-r${GITHUB_RUN_NUMBER}"
          fi
          # The ROUND suffix (the N in "r<N>") drives the APK file names and
          # the release title. It MUST follow the tag, not the run counter:
          # run numbers count every workflow run (CI, releases, re-runs), so
          # a tagged release is not guaranteed to run as run N --- the r11
          # tag actually ran as run 12 and briefly published assets named
          # "r12". When the tag matches the convention, its suffix IS the
          # round; only the computed-default dispatch path falls back to the
          # run number (which is exactly the number that tag embeds).
          if [[ "$TAG_NAME" =~ ^v${VERSION_NAME}-r([0-9]+)$ ]]; then
            ROUND="${BASH_REMATCH[1]}"
          else
            ROUND="$GITHUB_RUN_NUMBER"
          fi
          echo "versionName=$VERSION_NAME  editVersionName=$EDIT_VERSION_NAME  tag=$TAG_NAME  round=$ROUND"
          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "EDIT_VERSION_NAME=$EDIT_VERSION_NAME"
            echo "TAG_NAME=$TAG_NAME"
            echo "ROUND=$ROUND"
          } >> "$GITHUB_ENV"

      # ADR-0018: the release keystore lives ONLY in GitHub Encrypted Secrets
      # (TG_RELEASE_KEYSTORE_BASE64, set per ADR-0018) --- it is never
      # committed to the repo, so no clone can ever sign releases.
      - name: Decode release keystore
        run: |
          echo "${{ secrets.TG_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/toadgallery-release.jks"
          chmod 600 "$RUNNER_TEMP/toadgallery-release.jks"
          if [[ ! -s "$RUNNER_TEMP/toadgallery-release.jks" ]]; then
            echo "::error::decoded keystore is empty --- is TG_RELEASE_KEYSTORE_BASE64 set (ADR-0018)?"
            exit 1
          fi

      # ADR-0018 contract with the release signingConfigs in BOTH
      # apps/gallery/build.gradle.kts and apps/edit/build.gradle.kts (the
      # edit app's block landed in r43, mirroring the gallery's): the Gradle
      # build reads exactly these four TG_* env vars, for both apps. The
      # TG_RELEASE_* secret values are passed through the step env and
      # appended to GITHUB_ENV in one heredoc, so they never appear in
      # command lines or command logs (GitHub masks them in logs regardless
      # --- this keeps it clean).
      - name: Export signing environment for Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          TG_KEYSTORE_FILE=$RUNNER_TEMP/toadgallery-release.jks
          TG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          TG_KEY_ALIAS=$KEY_ALIAS
          TG_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      # One gradle invocation, both apps' release variants (r43). Each
      # assembleRelease runs its app's release-variant privacy gate
      # (ADR-0014, transitively via the assemble* anchors in both
      # apps/*/build.gradle.kts) plus R8 minify + resource shrink --- so
      # both APKs are re-verified offline-by-construction AND minified
      # (mapping.txt) before anything is published.
      - name: Build signed release APKs (gallery + edit)
        run: ./gradlew :apps:gallery:assembleRelease :apps:edit:assembleRelease --no-daemon --stacktrace

      # HARD SIGNATURE GATES (ADR-0018) --- the core invariant of this
      # workflow, now for BOTH APKs: an unsigned or wrongly signed APK of
      # EITHER app must NEVER be published. Per app:
      #   1. assembleRelease must have produced an APK, and it must not be a
      #      *-unsigned.apk (unsigned output means the TG_* signing env
      #      contract above is broken or the secrets are missing).
      #   2. apksigner must verify the APK's signature and print a signer.
      #   3. The signer certificate SHA-256 must equal the pinned release
      #      identity below --- the SAME pinned digest for both apps, the
      #      same single toadGALLERY release key (one key, both APKs, so
      #      each updates in place over its previous pre-releases). A debug
      #      key --- or any other keystore --- fails the job, so what gets
      #      published is always signed by THE toadGALLERY release key.
      # The logic is one app's worth of shell, factored into a function and
      # called twice; both calls are equally hard (any failure exits the
      # step and the publish never runs).
      - name: Verify release signatures (hard gates, both APKs)
        run: |
          # Resolve apksigner robustly: the exact pinned build-tools dir
          # first, then a glob fallback in case the runner layout differs.
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/apksigner"
          if [[ ! -x "$APKSIGNER" ]]; then
            APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -path '*36.0.0*/apksigner' -print -quit)"
          fi
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner not found under build-tools 36.0.0"
            exit 1
          fi

          # Pinned release identity (ADR-0018): the toadGALLERY release-key
          # cert --- identical for the gallery and the edit APK.
          EXPECTED_SHA256="8a4640e0732e28b84c2fa35ee7a350d104ce97d87df92262cc8439832bd29494"

          verify_release_signature() {
            local APP_LABEL="$1"
            local APK_DIR="$2"
            if [[ ! -d "$APK_DIR" ]]; then
              echo "::error::$APK_DIR does not exist --- assembleRelease produced no output for $APP_LABEL"
              exit 1
            fi
            local SIGNED_APK UNSIGNED_APK
            SIGNED_APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*unsigned*' -print -quit)"
            UNSIGNED_APK="$(find "$APK_DIR" -maxdepth 1 -name '*unsigned*.apk' -print -quit)"
            if [[ -z "$SIGNED_APK" ]]; then
              echo "::error::no signed release APK for $APP_LABEL in $APK_DIR (unsigned present: ${UNSIGNED_APK:-none}) --- the build did not sign; check the TG_* env contract (ADR-0018)"
              exit 1
            fi
            echo "$APP_LABEL release APK: $SIGNED_APK"

            # Non-zero exit from apksigner verify fails the step outright
            # (bash -e): the APK carries no valid signature.
            "$APKSIGNER" verify --print-certs "$SIGNED_APK" > "$RUNNER_TEMP/${APP_LABEL}-apk-certs.txt"
            cat "$RUNNER_TEMP/${APP_LABEL}-apk-certs.txt"

            local ACTUAL_SHA256
            ACTUAL_SHA256="$(grep -oP 'Signer #1 certificate SHA-256 digest: \K[0-9a-fA-F]+' "$RUNNER_TEMP/${APP_LABEL}-apk-certs.txt" | tr '[:upper:]' '[:lower:]')"
            if [[ -z "$ACTUAL_SHA256" ]]; then
              echo "::error::$APP_LABEL: apksigner reported no signer certificate --- signature did not verify"
              exit 1
            fi
            if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
              echo "::error::$APP_LABEL signer mismatch: expected $EXPECTED_SHA256, got $ACTUAL_SHA256 --- NOT the ADR-0018 release key; refusing to publish"
              exit 1
            fi
            echo "$APP_LABEL signature gate OK --- signer cert SHA-256 matches the pinned release identity."
            VERIFIED_APK="$SIGNED_APK"
          }

          # VERIFIED_APK is the function's out-parameter (a plain global
          # assignment, NOT an echo captured by command substitution --- the
          # function's log lines must not leak into a path).
          verify_release_signature "gallery" "apps/gallery/build/outputs/apk/release"
          GALLERY_APK="$VERIFIED_APK"
          verify_release_signature "edit" "apps/edit/build/outputs/apk/release"
          EDIT_APK="$VERIFIED_APK"
          echo "BOTH signature gates OK --- the gallery and the edit APK are signed by the pinned ADR-0018 release key."
          {
            echo "GALLERY_APK=$GALLERY_APK"
            echo "EDIT_APK=$EDIT_APK"
          } >> "$GITHUB_ENV"

      # Publishable set, per app (r43): the renamed APK, its sha256
      # checksum, and the R8 mapping.txt --- BOTH release builds are
      # minified, so both mappings are needed for crash symbolication, and
      # every name carries the app + version + round (a generic mapping.txt
      # is ambiguous across two apps and dozens of releases --- for better
      # finding).
      - name: Stage release artifacts
        run: |
          mkdir -p "$RELEASE_STAGE"
          APK_NAME="toadGALLERY-${VERSION_NAME}-r${ROUND}.apk"
          cp "$GALLERY_APK" "$RELEASE_STAGE/$APK_NAME"
          ( cd "$RELEASE_STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          EDIT_APK_NAME="toadGALLERY-edit-${EDIT_VERSION_NAME}-r${ROUND}.apk"
          cp "$EDIT_APK" "$RELEASE_STAGE/$EDIT_APK_NAME"
          ( cd "$RELEASE_STAGE" && sha256sum "$EDIT_APK_NAME" > "$EDIT_APK_NAME.sha256" )
          if [[ -f apps/gallery/build/outputs/mapping/release/mapping.txt ]]; then
            cp apps/gallery/build/outputs/mapping/release/mapping.txt "$RELEASE_STAGE/toadGALLERY-${VERSION_NAME}-r${ROUND}-mapping.txt"
          else
            echo "::warning::no gallery R8 mapping at apps/gallery/build/outputs/mapping/release/mapping.txt"
          fi
          if [[ -f apps/edit/build/outputs/mapping/release/mapping.txt ]]; then
            cp apps/edit/build/outputs/mapping/release/mapping.txt "$RELEASE_STAGE/toadGALLERY-edit-${EDIT_VERSION_NAME}-r${ROUND}-mapping.txt"
          else
            echo "::warning::no edit R8 mapping at apps/edit/build/outputs/mapping/release/mapping.txt"
          fi
          ls -l "$RELEASE_STAGE"
          cat "$RELEASE_STAGE/$APK_NAME.sha256" "$RELEASE_STAGE/$EDIT_APK_NAME.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apks
          path: ${{ env.RELEASE_STAGE }}
          if-no-files-found: warn
          retention-days: 30

      # softprops/action-gh-release creates the tag at the current SHA when it
      # does not exist yet --- that is what makes the dispatch path work: the
      # computed default tag (e.g. v0.4.0-alpha-r72) never exists in git
      # before the run. On a real `v*` tag push the tag already exists and
      # the release simply attaches to it. prerelease + make_latest: false
      # keep these testing builds clearly separate from any future stable
      # release (they never show up as "Latest"; the v1.0 cut is a human
      # decision per ADR-0018, never a workflow default).
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: toadGALLERY ${{ env.VERSION_NAME }} + Edit ${{ env.EDIT_VERSION_NAME }} — the Phase 11 close-out pre-release (r${{ env.ROUND }})
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_STAGE }}/*
          body: |
            **TESTING pre-release --- the Phase 11 close-out.** This is the
            final pre-v1.0 cut of toadGALLERY, the first release where BOTH
            apps ship together from the same commit. It is not a stable
            release; the device-verification matrix stays human-only (see
            `docs/phase-11/known-limitations.md`).

            **The APK files:**

            - `toadGALLERY-<version>.apk` --- **the gallery, the main app.**
              The photo/video timeline, albums, on-device smart search +
              semantic search, metadata details + edit + offline maps,
              trash, hidden vault, Moments/Things. Install this for the
              gallery.
            - `toadGALLERY-edit-<version>.apk` --- **the companion editor.**
              Crop/rotate/perspective, adjustments, LUT filters, text,
              stickers, drawing, mosaic/blur, frames, magic erase, sky
              replacement, bokeh, opt-in face retouch, and the lightweight
              video editor (trim/mute/slow-mo/frame extraction/GIF/WebP).
              A separate app ID, opened from the gallery via the versioned
              content-URI contract --- install BOTH for the full experience.

            - Requires Android 8.0+ (minSdk 26). Both APKs are signed with
              the same toadGALLERY release key (ADR-0018), so updates
              install in place over previous toadGALLERY pre-releases.
            - Verify your download: `sha256sum -c toadGALLERY-*.apk.sha256`
              and/or `apksigner verify --print-certs <apk>` --- the signer
              certificate SHA-256 must be
              `8a4640e0732e28b84c2fa35ee7a350d104ce97d87df92262cc8439832bd29494`
              (CI pins this digest for BOTH APKs before anything is
              published; an unsigned or debug-signed build can never reach
              this page).
            - The per-app `*-mapping.txt` files are the R8 mappings for
              crash de-obfuscation, kept per app per release so traces from
              testing devices can always be symbolicated.
            - Built from commit `${{ github.sha }}`. Full notes:
              `docs/phase-11/release-notes.md`. Reproducibility: the
              Reproducible workflow run on this tag.
