name: Release

# toadGALLERY release workflow --- issue #59, ADR-0018 (docs/integration-decisions.md)
#
# Dedicated PRE-RELEASE pipeline for SIGNED testing APKs. User directive
# (issue #59): release APKs for pre-release testing must be signed, and they
# are produced by this dedicated release workflow --- not mixed into the
# canonical CI.
#
# Phase 11 shape (r43, the release-engineering round): ONE pipeline, BOTH
# apps. The gallery APK and the edit APK are built, signature-gated and
# published together from the same commit --- the two apps are one product
# (the editor is opened from the gallery via the versioned content-URI
# contract), so the Phase 11 close-out cut ships them as a pair:
#   - Triggers: `v*` tag pushes (cutting a release) and workflow_dispatch
#     (ad-hoc testing pre-releases; empty tag_name input falls back to a
#     computed v<versionName>-r<run_number> default tag).
#   - ADR-0013: ci.yml remains the canonical CI (build/lint/test gating PRs
#     and main). This file does NOT gate PRs and deliberately runs no lint
#     or unit tests --- those are ci.yml's job on green merges; a release is
#     only ever cut from an already-reviewed, already-green SHA.
#   - ADR-0014: the INTERNET privacy gates still run here, transitively ---
#     the release-variant gates anchor on assembleRelease in BOTH
#     apps/gallery/build.gradle.kts and apps/edit/build.gradle.kts, so every
#     published APK is re-verified as offline-by-construction (the editor's
#     merged-manifest gate has no allowlist at all).
#   - ADR-0018: release signing, now for BOTH apps with the SAME release
#     key. The keystore and its credentials live only in GitHub Encrypted
#     Secrets (referenced by name, never committed), and each APK's signer
#     certificate is pinned in its own hard signature gate below, so an
#     unsigned or debug-key APK of either app can never reach a GitHub
#     release.
#   - Artifacts: per-app APK + .sha256 + a clearly-named per-app
#     mapping.txt (a generic mapping.txt is ambiguous across two apps and
#     dozens of releases --- the r43 rename is for better finding).
#   - Still a pre-release per ADR-0018: prerelease + make_latest false,
#     until the v1.0 cut (a human decision, never a workflow default).
#   - r46 (the APK-matrix round): the gallery ships as FOUR flavors ---
#     basic (canonical id, NO engine library, NO engine UI) plus the
#     engine / semantic / face family (distinct applicationIds, installed
#     SEPARATELY, like the edit app). The release builds basic + the edit
#     app in one property-less gradle invocation and the engine family in
#     a second, -PwithEngine one (the property is GLOBAL: one invocation
#     for everything would register the engine jniLibs srcDir for every
#     variant and package the native libraries into the basic APK), then a
#     hard unzip negative gate enforces the split before anything is
#     staged. Five APKs, five per-APK mappings, five signature gates.
#     The matrix: docs/phase-11/apk-matrix.md.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish under. Leave empty to compute v<versionName>-r<run_number> at the built SHA.'
        type: string
        required: false
        default: ''
  push:
    tags: [ 'v*' ]

jobs:
  release:
    name: Build + publish signed pre-release APKs (the gallery matrix + edit)
    runs-on: ubuntu-latest
    # 30 was the Phase-0 budget; the r10 Room+KSP round makes the release
    # build longer (R8 now compiles the Room-generated code), and a resource
    # exhaustion hang must still leave room for gradle to print its failure
    # report instead of being killed mid-stack. Since r43 the job builds
    # BOTH apps' release variants (two R8 passes); since r46 the gallery is
    # the four-flavor matrix --- FIVE R8 passes (basic/engine/semantic/face
    # gallery + the edit app) AND one cargo-ndk engine build --- so the
    # budget moves to 60.
    timeout-minutes: 60
    # Creating the tag (dispatch path) and the GitHub release needs write
    # access to repo contents.
    permissions:
      contents: write
    # Release builds are never cancelled mid-flight: a queued run waits for
    # the current publish to finish rather than tearing it down half-way.
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fixed staging dir for the publishable artifact set, exported to
      # GITHUB_ENV from this first runnable step so the always() artifact
      # upload below can reference it even if an earlier step failed.
      # ($RUNNER_TEMP is a shell variable --- the `runner` context is NOT
      # available in job-level `env` expressions, which is why this is a
      # step, not a job env entry.)
      - name: Resolve staging directory
        run: echo "RELEASE_STAGE=$RUNNER_TEMP/release-staging" >> "$GITHUB_ENV"

      # F-2 (follow-up 2026-11-04): the canonical toolchain setup
      # (.github/actions/toad-setup) --- the pure-Android shape (JDK 17 +
      # SDK platform 36/build-tools 36 + the Gradle cache + gradlew chmod;
      # no Rust). The ADR-0018 signing steps below are release.yml's own.
      - name: Set up the toolchain (Android)
        uses: ./.github/actions/toad-setup

      # Both trigger paths funnel into a single TAG_NAME here:
      #   - tag push: the pushed tag (GITHUB_REF_NAME, i.e. github.ref_name)
      #   - dispatch: the tag_name input if non-empty, else the computed
      #     default v<versionName>-r<run_number> (e.g. versionName
      #     "0.4.0-alpha" at run 72 becomes v0.4.0-alpha-r72).
      # VERSION_NAME comes straight from apps/gallery/build.gradle.kts so the
      # tag always agrees with what the gallery APK actually reports.
      # EDIT_VERSION_NAME comes from apps/edit/build.gradle.kts --- the
      # editor carries its OWN version line (the two apps ship and version
      # separately), and that gradle file holds MULTIPLE
      # versionCode/versionName pairs (the append-per-round convention: the
      # LAST assignment wins), so the editor's version is the LAST match
      # where the gallery's is the first.
      - name: Resolve release tag and version names
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          VERSION_NAME="$(grep -oP 'versionName = "\K[^"]+' apps/gallery/build.gradle.kts | head -n1)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "::error::could not extract versionName from apps/gallery/build.gradle.kts"
            exit 1
          fi
          EDIT_VERSION_NAME="$(grep -oP 'versionName = "\K[^"]+' apps/edit/build.gradle.kts | tail -n1)"
          if [[ -z "$EDIT_VERSION_NAME" ]]; then
            echo "::error::could not extract versionName from apps/edit/build.gradle.kts (the last-wins pair)"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          elif [[ -n "$DISPATCH_TAG" ]]; then
            TAG_NAME="$DISPATCH_TAG"
          else
            TAG_NAME="v${VERSION_NAME}-r${GITHUB_RUN_NUMBER}"
          fi
          # The ROUND suffix (the N in "r<N>") drives the APK file names and
          # the release title. It MUST follow the tag, not the run counter:
          # run numbers count every workflow run (CI, releases, re-runs), so
          # a tagged release is not guaranteed to run as run N --- the r11
          # tag actually ran as run 12 and briefly published assets named
          # "r12". When the tag matches the convention, its suffix IS the
          # round; only the computed-default dispatch path falls back to the
          # run number (which is exactly the number that tag embeds).
          if [[ "$TAG_NAME" =~ ^v${VERSION_NAME}-r([0-9]+)$ ]]; then
            ROUND="${BASH_REMATCH[1]}"
          else
            ROUND="$GITHUB_RUN_NUMBER"
          fi
          echo "versionName=$VERSION_NAME  editVersionName=$EDIT_VERSION_NAME  tag=$TAG_NAME  round=$ROUND"
          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "EDIT_VERSION_NAME=$EDIT_VERSION_NAME"
            echo "TAG_NAME=$TAG_NAME"
            echo "ROUND=$ROUND"
          } >> "$GITHUB_ENV"

      # ADR-0018: the release keystore lives ONLY in GitHub Encrypted Secrets
      # (TG_RELEASE_KEYSTORE_BASE64, set per ADR-0018) --- it is never
      # committed to the repo, so no clone can ever sign releases.
      # F-2 (r51): the keystore secret reaches this step through a
      # step-level env var (never interpolated into the script body).
      - name: Decode release keystore
        env:
          TG_RELEASE_KEYSTORE_BASE64: ${{ secrets.TG_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$TG_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/toadgallery-release.jks"
          chmod 600 "$RUNNER_TEMP/toadgallery-release.jks"
          if [[ ! -s "$RUNNER_TEMP/toadgallery-release.jks" ]]; then
            echo "::error::decoded keystore is empty --- is TG_RELEASE_KEYSTORE_BASE64 set (ADR-0018)?"
            exit 1
          fi

      # ADR-0018 contract with the release signingConfigs in BOTH
      # apps/gallery/build.gradle.kts and apps/edit/build.gradle.kts (the
      # edit app's block landed in r43, mirroring the gallery's): the Gradle
      # build reads exactly these four TG_* env vars, for both apps. F-2
      # (r51): instead of a job-persisted GITHUB_ENV write through an
      # unquoted heredoc (whose shell expansion could corrupt a secret
      # containing `$`), the three credential secrets and the keystore path
      # now reach EACH gradle invocation through step-level env --- they
      # never appear in command lines or command logs and never persist
      # beyond the invocation that consumes them (GitHub masks them in
      # logs regardless --- this keeps it clean).
      # TWO gradle invocations, deliberately (r46). -PwithEngine is a
      # GLOBAL property: in one invocation it would register the engine
      # jniLibs srcDir for EVERY variant, packaging the native libraries
      # into the basic APK --- the exact failure class the maintainer
      # reported ("current apk has not included engine library but showing
      # in app"), here in its mirror-image direction. So:
      #   1. the BASIC gallery flavor + the edit app, property-less;
      #   2. the ENGINE family (engine / semantic / face flavors) with
      #      -PwithEngine (cargo-ndk builds libtoad_ml_jni.so +
      #      libonnxruntime.so into the build-dir jniLibs srcDir).
      # Each assembleRelease runs its release-variant privacy gate
      # (ADR-0014, transitively via the assemble* anchors in both
      # apps/*/build.gradle.kts) plus R8 minify + resource shrink --- so
      # all five APKs are re-verified offline-by-construction AND minified
      # (mapping.txt) before anything is published.
      - name: Build signed release APKs (basic gallery + edit, property-less)
        env:
          TG_KEYSTORE_FILE: ${{ runner.temp }}/toadgallery-release.jks
          TG_KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          TG_KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          TG_KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :apps:gallery:assembleBasicRelease :apps:edit:assembleRelease --no-daemon --stacktrace

      - name: Build signed release APKs (engine / semantic / face galleries, -PwithEngine)
        env:
          TG_KEYSTORE_FILE: ${{ runner.temp }}/toadgallery-release.jks
          TG_KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          TG_KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          TG_KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :apps:gallery:assembleEngineRelease :apps:gallery:assembleSemanticRelease :apps:gallery:assembleFaceRelease -PwithEngine --no-daemon --stacktrace

      # HARD SIGNATURE GATES (ADR-0018) --- the core invariant of this
      # workflow, now for ALL FIVE APKs (r46: the four gallery flavors +
      # the edit app): an unsigned or wrongly signed APK of ANY of them
      # must NEVER be published. Per app:
      #   1. assembleRelease must have produced an APK, and it must not be a
      #      *-unsigned.apk (unsigned output means the TG_* signing env
      #      contract above is broken or the secrets are missing).
      #   2. apksigner must verify the APK's signature and print a signer.
      #   3. The signer certificate SHA-256 must equal the pinned release
      #      identity below --- the SAME pinned digest for all five, the
      #      same single toadGALLERY release key (one key, every APK, so
      #      each updates in place over its previous pre-releases; the four
      #      gallery flavors differ only in applicationId, not identity).
      #      A debug key --- or any other keystore --- fails the job, so
      #      what gets published is always signed by THE toadGALLERY
      #      release key.
      # The logic is one app's worth of shell, factored into a function and
      # called five times; all five calls are equally hard (any failure
      # exits the step and the publish never runs).
      - name: Verify release signatures (hard gates, all five APKs)
        run: |
          # Resolve apksigner robustly: the exact pinned build-tools dir
          # first, then a glob fallback in case the runner layout differs.
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/apksigner"
          if [[ ! -x "$APKSIGNER" ]]; then
            APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -path '*36.0.0*/apksigner' -print -quit)"
          fi
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner not found under build-tools 36.0.0"
            exit 1
          fi

          # Pinned release identity (ADR-0018): the toadGALLERY release-key
          # cert --- identical for the gallery and the edit APK.
          EXPECTED_SHA256="8a4640e0732e28b84c2fa35ee7a350d104ce97d87df92262cc8439832bd29494"

          verify_release_signature() {
            local APP_LABEL="$1"
            local APK_DIR="$2"
            if [[ ! -d "$APK_DIR" ]]; then
              echo "::error::$APK_DIR does not exist --- assembleRelease produced no output for $APP_LABEL"
              exit 1
            fi
            local SIGNED_APK UNSIGNED_APK
            SIGNED_APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*unsigned*' -print -quit)"
            UNSIGNED_APK="$(find "$APK_DIR" -maxdepth 1 -name '*unsigned*.apk' -print -quit)"
            if [[ -z "$SIGNED_APK" ]]; then
              echo "::error::no signed release APK for $APP_LABEL in $APK_DIR (unsigned present: ${UNSIGNED_APK:-none}) --- the build did not sign; check the TG_* env contract (ADR-0018)"
              exit 1
            fi
            echo "$APP_LABEL release APK: $SIGNED_APK"

            # Non-zero exit from apksigner verify fails the step outright
            # (bash -e): the APK carries no valid signature.
            "$APKSIGNER" verify --print-certs "$SIGNED_APK" > "$RUNNER_TEMP/${APP_LABEL}-apk-certs.txt"
            cat "$RUNNER_TEMP/${APP_LABEL}-apk-certs.txt"

            local ACTUAL_SHA256
            ACTUAL_SHA256="$(grep -oP 'Signer #1 certificate SHA-256 digest: \K[0-9a-fA-F]+' "$RUNNER_TEMP/${APP_LABEL}-apk-certs.txt" | tr '[:upper:]' '[:lower:]')"
            if [[ -z "$ACTUAL_SHA256" ]]; then
              echo "::error::$APP_LABEL: apksigner reported no signer certificate --- signature did not verify"
              exit 1
            fi
            if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
              echo "::error::$APP_LABEL signer mismatch: expected $EXPECTED_SHA256, got $ACTUAL_SHA256 --- NOT the ADR-0018 release key; refusing to publish"
              exit 1
            fi
            echo "$APP_LABEL signature gate OK --- signer cert SHA-256 matches the pinned release identity."
            VERIFIED_APK="$SIGNED_APK"
          }

          # VERIFIED_APK is the function's out-parameter (a plain global
          # assignment, NOT an echo captured by command substitution --- the
          # function's log lines must not leak into a path).
          # r46: five gates, one per matrix artifact (the gallery APK dirs
          # are flavor-qualified since the four-way matrix landed).
          verify_release_signature "gallery-basic" "apps/gallery/build/outputs/apk/basic/release"
          BASIC_APK="$VERIFIED_APK"
          verify_release_signature "gallery-engine" "apps/gallery/build/outputs/apk/engine/release"
          ENGINE_APK="$VERIFIED_APK"
          verify_release_signature "gallery-semantic" "apps/gallery/build/outputs/apk/semantic/release"
          SEMANTIC_APK="$VERIFIED_APK"
          verify_release_signature "gallery-face" "apps/gallery/build/outputs/apk/face/release"
          FACE_APK="$VERIFIED_APK"
          verify_release_signature "edit" "apps/edit/build/outputs/apk/release"
          EDIT_APK="$VERIFIED_APK"
          echo "ALL FIVE signature gates OK --- the four gallery flavors and the edit APK are signed by the pinned ADR-0018 release key."
          {
            echo "BASIC_APK=$BASIC_APK"
            echo "ENGINE_APK=$ENGINE_APK"
            echo "SEMANTIC_APK=$SEMANTIC_APK"
            echo "FACE_APK=$FACE_APK"
            echo "EDIT_APK=$EDIT_APK"
          } >> "$GITHUB_ENV"

      # r46 THE PACKAGING NEGATIVE GATE --- the maintainer's exact
      # complaint, enforced ("current apk has not included engine library
      # but showing in app"): the matrix contract
      # (docs/phase-11/apk-matrix.md) is that the BASIC gallery APK carries
      # NEITHER engine native library (it also hides every engine UI
      # surface via BuildShape), and every engine-family APK (engine /
      # semantic / face) carries BOTH. The positive direction was already
      # routine (the ci.yml engine-android / apk-build-engine unzip gates);
      # the NEGATIVE direction on basic is what a global -PwithEngine leak
      # into the property-less invocation would break --- so it is checked
      # here, after signing and before anything is staged. Same mechanism
      # as the CI gates (unzip -l); any miss fails the run.
      - name: Verify the matrix's engine-library packaging (negative gate)
        run: |
          for LIB in lib/arm64-v8a/libtoad_ml_jni.so lib/arm64-v8a/libonnxruntime.so; do
            if unzip -l "$BASIC_APK" | grep -q "$LIB"; then
              echo "::error::the BASIC gallery APK must NOT carry $LIB --- -PwithEngine leaked into the property-less basic invocation"
              exit 1
            fi
          done
          for APK in "$ENGINE_APK" "$SEMANTIC_APK" "$FACE_APK"; do
            for LIB in lib/arm64-v8a/libtoad_ml_jni.so lib/arm64-v8a/libonnxruntime.so; do
              if ! unzip -l "$APK" | grep -q "$LIB"; then
                echo "::error::$APK must carry $LIB (the engine-family contract)"
                exit 1
              fi
            done
          done
          echo "engine-library packaging gate OK --- basic carries NEITHER library; engine/semantic/face carry BOTH."

      # F-14 (r51): the release-stage PERMISSION gate --- aapt2 re-checks the
      # FINAL APKs' uses-permission sets after signing and before anything is
      # staged or published. The signature gate above covers identity; this
      # gate covers the privacy surface at the point of no return: the
      # release-time INTERNET guarantee no longer rests solely on the
      # build-time merged-manifest gates (which for the gallery are only as
      # strong as their allowlist, F-4). The rule is "no UNEXPECTED
      # permissions": every uses-permission the APK carries must be in its
      # allowlist or the run fails and nothing is published. (The reverse is
      # deliberately NOT asserted --- a missing allowlisted entry only breaks
      # a feature, e.g. downloads; an extra one is a privacy regression.)
      # The allowlists are derived from the source manifests plus the
      # documented library merges; docs/phase-11/permissions-and-privacy.md
      # is the record:
      #   - the gallery source manifest declares the pinned five
      #     (READ_MEDIA_IMAGES / READ_MEDIA_VIDEO / READ_EXTERNAL_STORAGE /
      #     ACCESS_MEDIA_LOCATION + the ADR-0020 model-fetch INTERNET);
      #   - androidx.work merges WAKE_LOCK + RECEIVE_BOOT_COMPLETED,
      #     androidx.biometric merges USE_BIOMETIC (both documented and
      #     pinned by PrivacyPolicyTest); the ACCESS_NETWORK_STATE and
      #     FOREGROUND_SERVICE injections are stripped at merge time
      #     (tools:node="remove") and never reach a merged manifest;
      #   - the BASIC flavor's r50 overlay strips INTERNET, so INTERNET is
      #     not in basic's allowlist: its presence fails below as an
      #     unexpected permission (the hard fail F-14 asks for);
      #   - the edit app's only request is its own pre-Q capped
      #     WRITE_EXTERNAL_STORAGE; its r41 hard strip keeps the merged
      #     manifest INTERNET-free (onnxruntime's AAR declaration is removed
      #     at merge time), so edit's allowlist excludes INTERNET the same
      #     way.
      # aapt2 is resolved exactly like the signature gate's apksigner: the
      # pinned build-tools dir first, glob fallback if the runner layout
      # differs. The found set is printed per APK for auditability.
      - name: Verify the release APKs' permission sets (uses-permission gates)
        run: |
          # Resolve aapt2 like the signature gate resolves apksigner: the
          # exact pinned build-tools dir first, then a glob fallback in case
          # the runner layout differs.
          AAPT2="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt2"
          if [[ ! -x "$AAPT2" ]]; then
            AAPT2="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 | sort -V | tail -1)"
          fi
          if [[ -z "$AAPT2" || ! -x "$AAPT2" ]]; then
            echo "::error::aapt2 not found under build-tools 36.0.0"
            exit 1
          fi

          # The gallery's manifest-derived base set: the source manifest's
          # declared five minus INTERNET, plus the documented library merges.
          GALLERY_BASE="android.permission.READ_MEDIA_IMAGES android.permission.READ_MEDIA_VIDEO android.permission.READ_EXTERNAL_STORAGE android.permission.ACCESS_MEDIA_LOCATION android.permission.USE_BIOMETIC android.permission.WAKE_LOCK android.permission.RECEIVE_BOOT_COMPLETED"

          # One gate per APK; UNEXPECTED accumulates across all five.
          check_permissions() {
            local LABEL="$1" APK="$2"; shift 2
            local ALLOWED="$*"
            local FOUND name
            FOUND="$("$AAPT2" dump badging "$APK" | sed -n "s/^uses-permission[^:]*: name='\([^']*\)'.*$/\1/p")"
            echo "== $LABEL: $APK"
            if [[ -n "$FOUND" ]]; then
              printf '%s\n' "$FOUND" | sed 's/^/   uses-permission: /'
            else
              echo "   (aapt2 reported no uses-permission lines)"
            fi
            while IFS= read -r name; do
              if [[ -n "$name" ]]; then
                case " $ALLOWED " in
                  *" $name "*)
                    ;;
                  *)
                    echo "::error::$LABEL: unexpected uses-permission '$name' --- not in this APK's manifest-derived allowlist; refusing to publish"
                    UNEXPECTED=1
                    ;;
                esac
              fi
            done <<< "$FOUND"
            return 0
          }

          UNEXPECTED=0
          # The engine family keeps the main manifest's ADR-0020
          # model-fetch INTERNET (the flavors download models).
          check_permissions "gallery-basic"    "$BASIC_APK"    "$GALLERY_BASE"
          check_permissions "gallery-engine"   "$ENGINE_APK"   "$GALLERY_BASE android.permission.INTERNET"
          check_permissions "gallery-semantic" "$SEMANTIC_APK" "$GALLERY_BASE android.permission.INTERNET"
          check_permissions "gallery-face"     "$FACE_APK"     "$GALLERY_BASE android.permission.INTERNET"
          check_permissions "edit"             "$EDIT_APK"     "android.permission.WRITE_EXTERNAL_STORAGE"

          if [[ "$UNEXPECTED" != 0 ]]; then
            echo "::error::permission gate FAILED --- at least one release APK carries a uses-permission outside its manifest-derived allowlist; nothing is published"
            exit 1
          fi
          echo "permission gate OK --- all five APKs' uses-permission sets are within their allowlists (basic and edit carry no INTERNET at all)."

      # Publishable set (r43 shape, r46 matrix): FIVE renamed APKs, each
      # with its sha256 checksum, and FIVE clearly-named per-APK R8
      # mapping.txt files --- every release build is minified, so every
      # mapping is needed for crash symbolication, and every name carries
      # the app/flavor + version + round (a generic mapping.txt is
      # ambiguous across five APKs and dozens of releases --- for better
      # finding). The four gallery flavors share versionName/versionCode;
      # the flavor word in the name is what tells them apart.
      - name: Stage release artifacts
        run: |
          mkdir -p "$RELEASE_STAGE"
          BASIC_APK_NAME="toadGALLERY-${VERSION_NAME}-r${ROUND}.apk"
          cp "$BASIC_APK" "$RELEASE_STAGE/$BASIC_APK_NAME"
          ( cd "$RELEASE_STAGE" && sha256sum "$BASIC_APK_NAME" > "$BASIC_APK_NAME.sha256" )
          ENGINE_APK_NAME="toadGALLERY-engine-${VERSION_NAME}-r${ROUND}.apk"
          cp "$ENGINE_APK" "$RELEASE_STAGE/$ENGINE_APK_NAME"
          ( cd "$RELEASE_STAGE" && sha256sum "$ENGINE_APK_NAME" > "$ENGINE_APK_NAME.sha256" )
          SEMANTIC_APK_NAME="toadGALLERY-semantic-${VERSION_NAME}-r${ROUND}.apk"
          cp "$SEMANTIC_APK" "$RELEASE_STAGE/$SEMANTIC_APK_NAME"
          ( cd "$RELEASE_STAGE" && sha256sum "$SEMANTIC_APK_NAME" > "$SEMANTIC_APK_NAME.sha256" )
          FACE_APK_NAME="toadGALLERY-face-${VERSION_NAME}-r${ROUND}.apk"
          cp "$FACE_APK" "$RELEASE_STAGE/$FACE_APK_NAME"
          ( cd "$RELEASE_STAGE" && sha256sum "$FACE_APK_NAME" > "$FACE_APK_NAME.sha256" )
          EDIT_APK_NAME="toadGALLERY-edit-${EDIT_VERSION_NAME}-r${ROUND}.apk"
          cp "$EDIT_APK" "$RELEASE_STAGE/$EDIT_APK_NAME"
          ( cd "$RELEASE_STAGE" && sha256sum "$EDIT_APK_NAME" > "$EDIT_APK_NAME.sha256" )
          # r46: with flavors, AGP moves the gallery mappings to
          # mapping/<flavor><type>/ (basicRelease/engineRelease/...); the
          # edit app's directory is unchanged. Each mapping is named for
          # ITS APK.
          if [[ -f apps/gallery/build/outputs/mapping/basicRelease/mapping.txt ]]; then
            cp apps/gallery/build/outputs/mapping/basicRelease/mapping.txt "$RELEASE_STAGE/toadGALLERY-${VERSION_NAME}-r${ROUND}-mapping.txt"
          else
            echo "::warning::no basic gallery R8 mapping at apps/gallery/build/outputs/mapping/basicRelease/mapping.txt"
          fi
          if [[ -f apps/gallery/build/outputs/mapping/engineRelease/mapping.txt ]]; then
            cp apps/gallery/build/outputs/mapping/engineRelease/mapping.txt "$RELEASE_STAGE/toadGALLERY-engine-${VERSION_NAME}-r${ROUND}-mapping.txt"
          else
            echo "::warning::no engine gallery R8 mapping at apps/gallery/build/outputs/mapping/engineRelease/mapping.txt"
          fi
          if [[ -f apps/gallery/build/outputs/mapping/semanticRelease/mapping.txt ]]; then
            cp apps/gallery/build/outputs/mapping/semanticRelease/mapping.txt "$RELEASE_STAGE/toadGALLERY-semantic-${VERSION_NAME}-r${ROUND}-mapping.txt"
          else
            echo "::warning::no semantic gallery R8 mapping at apps/gallery/build/outputs/mapping/semanticRelease/mapping.txt"
          fi
          if [[ -f apps/gallery/build/outputs/mapping/faceRelease/mapping.txt ]]; then
            cp apps/gallery/build/outputs/mapping/faceRelease/mapping.txt "$RELEASE_STAGE/toadGALLERY-face-${VERSION_NAME}-r${ROUND}-mapping.txt"
          else
            echo "::warning::no face gallery R8 mapping at apps/gallery/build/outputs/mapping/faceRelease/mapping.txt"
          fi
          if [[ -f apps/edit/build/outputs/mapping/release/mapping.txt ]]; then
            cp apps/edit/build/outputs/mapping/release/mapping.txt "$RELEASE_STAGE/toadGALLERY-edit-${EDIT_VERSION_NAME}-r${ROUND}-mapping.txt"
          else
            echo "::warning::no edit R8 mapping at apps/edit/build/outputs/mapping/release/mapping.txt"
          fi
          ls -l "$RELEASE_STAGE"
          cat "$RELEASE_STAGE"/*.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-apks
          path: ${{ env.RELEASE_STAGE }}
          if-no-files-found: warn
          retention-days: 30

      # softprops/action-gh-release creates the tag at the current SHA when it
      # does not exist yet --- that is what makes the dispatch path work: the
      # computed default tag (e.g. v0.4.0-alpha-r72) never exists in git
      # before the run. On a real `v*` tag push the tag already exists and
      # the release simply attaches to it. prerelease + make_latest: false
      # keep these testing builds clearly separate from any future stable
      # release (they never show up as "Latest"; the v1.0 cut is a human
      # decision per ADR-0018, never a workflow default).
      # F-1 (r51): SHA-pinned --- this step holds the job's contents: write
      # scope, so a moved/compromised upstream tag can no longer execute
      # here; the highest v2 tag at pin time was v2.6.2.
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: toadGALLERY ${{ env.VERSION_NAME }} + Edit ${{ env.EDIT_VERSION_NAME }} — the APK-matrix pre-release (r${{ env.ROUND }})
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_STAGE }}/*
          body: |
            **TESTING pre-release --- the r46 APK matrix.** The gallery now
            ships as FOUR flavors and the companion editor as the fifth
            artifact, all built and published from the same commit. Not a
            stable release; the device-verification matrix stays human-only
            (see `docs/phase-11/known-limitations.md`).

            **The five APK files:**

            - `toadGALLERY-<version>.apk` --- **the gallery, BASIC flavor.**
              The photo/video timeline, albums, name search, metadata
              details + edit + offline maps, trash, hidden vault. NO engine
              library and NO AI features --- the offline-first core, on the
              canonical applicationId (this is the file that updates in
              place over previous gallery pre-releases).
            - `toadGALLERY-engine-<version>.apk` --- **the gallery, ENGINE
              flavor.** Everything the basic flavor has PLUS the full
              on-device AI stack: face clustering (People) AND semantic
              search + Things, with the pinned models downloaded on demand
              from the single allowlisted host (or bundled via the
              model-pack workflow). Installs SEPARATELY from basic.
            - `toadGALLERY-semantic-<version>.apk` --- **the gallery,
              SEMANTIC flavor.** The engine build with ONLY the semantic
              index: Magic Search + Things, no People.
            - `toadGALLERY-face-<version>.apk` --- **the gallery, FACE
              flavor.** The engine build with ONLY the face index:
              People, no Magic Search / Things.
            - `toadGALLERY-edit-<version>.apk` --- **the companion editor.**
              Crop/rotate/perspective, adjustments, LUT filters, text,
              stickers, drawing, mosaic/blur, frames, magic erase, sky
              replacement, bokeh, opt-in face retouch, and the lightweight
              video editor (trim/mute/slow-mo/frame extraction/GIF/WebP).
              A separate app ID, opened from the gallery via the versioned
              content-URI contract --- install it alongside ANY gallery
              flavor.

            The four gallery flavors share versionCode and versionName and
            differ ONLY in applicationId (`io.github.dukeoftoad.gallery` /
            `.engine` / `.semantic` / `.face`) and the AI surfaces their
            build shape compiles in --- any combination coexists on one
            device, like the edit app. Matrix details:
            `docs/phase-11/apk-matrix.md`.

            - Requires Android 8.0+ (minSdk 26). All five APKs are signed
              with the same toadGALLERY release key (ADR-0018), so updates
              install in place over previous toadGALLERY pre-releases.
            - Verify your download: `sha256sum -c toadGALLERY-*.apk.sha256`
              and/or `apksigner verify --print-certs <apk>` --- the signer
              certificate SHA-256 must be
              `8a4640e0732e28b84c2fa35ee7a350d104ce97d87df92262cc8439832bd29494`
              (CI pins this digest for ALL FIVE APKs before anything is
              published; an unsigned or debug-signed build can never reach
              this page).
            - The packaging rule is hard-verified at release time: the
              basic APK carries NEITHER engine native library, and the
              engine/semantic/face APKs carry BOTH (`libtoad_ml_jni.so` +
              `libonnxruntime.so`).
            - The per-APK `*-mapping.txt` files are the R8 mappings for
              crash de-obfuscation, kept per APK per release so traces from
              testing devices can always be symbolicated.
            - Built from commit `${{ github.sha }}`. Full notes:
              `docs/phase-11/release-notes.md`. Reproducibility: the
              Reproducible workflow run on this tag.
