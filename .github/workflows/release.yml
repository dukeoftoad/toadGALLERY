name: Release

# toadGALLERY Edit release workflow --- issue #59, ADR-0018
# (docs/integration-decisions.md).
#
# Dedicated PRE-RELEASE pipeline for the SIGNED testing APK of the editor.
# User directive (issue #59): release APKs for pre-release testing must be
# signed, and they are produced by this dedicated release workflow --- not
# mixed into the canonical CI.
#
#   - Triggers: workflow_dispatch only (ad-hoc testing pre-releases; an
#     empty tag_name input falls back to a computed
#     v<versionName>-r<run_number> default tag). There is NO automated
#     tag-push trigger: releases are cut deliberately.
#   - ADR-0013: ci.yml remains the canonical CI (build/lint/test gating
#     PRs). This file does NOT gate PRs and deliberately runs no lint or
#     unit tests --- those are ci.yml's job on green merges; a release is
#     only ever cut from an already-reviewed, already-green SHA.
#   - ADR-0014: the editor's release-variant gate anchors on
#     assembleRelease in editor/app/build.gradle.kts, so every published
#     APK is re-verified as model-download-only networking (the merged-
#     manifest gate allows exactly android.permission.INTERNET --- the
#     on-demand AI model downloads --- and refuses anything else); the
#     release-time permission gate below re-checks the final APK too.
#   - ADR-0018: release signing. The keystore and its credentials live
#     only in GitHub Encrypted Secrets (referenced by name, never
#     committed), and the signer certificate is pinned in a hard signature
#     gate below, so an unsigned or debug-key APK can never reach a GitHub
#     release.
#   - Artifacts: the APK + .sha256 + a clearly-named R8 mapping.txt.
#   - Still a pre-release per ADR-0018: prerelease + make_latest false,
#     until the v1.0 cut (a human decision, never a workflow default).

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish under. Leave empty to compute v<versionName>-r<run_number> at the built SHA.'
        type: string
        required: false
        default: ''

jobs:
  release:
    name: Build + publish the signed pre-release APK (the editor)
    runs-on: ubuntu-latest
    # The release build is one R8-minified assembleRelease pass; the budget
    # leaves room for gradle to print its failure report instead of being
    # killed mid-stack.
    timeout-minutes: 30
    # Creating the tag (dispatch path) and the GitHub release needs write
    # access to repo contents.
    permissions:
      contents: write
    # Release builds are never cancelled mid-flight: a queued run waits for
    # the current publish to finish rather than tearing it down half-way.
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fixed staging dir for the publishable artifact set, exported to
      # GITHUB_ENV from this first runnable step so the always() artifact
      # upload below can reference it even if an earlier step failed.
      # ($RUNNER_TEMP is a shell variable --- the `runner` context is NOT
      # available in job-level `env` expressions, which is why this is a
      # step, not a job env entry.)
      - name: Resolve staging directory
        run: echo "RELEASE_STAGE=$RUNNER_TEMP/release-staging" >> "$GITHUB_ENV"

      # The canonical toolchain setup (.github/actions/toad-setup): the
      # pure-Android shape (JDK 17 + SDK platform 36/build-tools 36 + the
      # Gradle cache + gradlew chmod). The ADR-0018 signing steps below are
      # release.yml's own.
      - name: Set up the toolchain (Android)
        uses: ./.github/actions/toad-setup

      # Both trigger paths funnel into a single TAG_NAME here:
      #   - dispatch: the tag_name input if non-empty, else the computed
      #     default v<versionName>-r<run_number> (e.g. versionName
      #     "0.4.14-edit-alpha" at run 72 becomes v0.4.14-edit-alpha-r72).
      # EDIT_VERSION_NAME comes straight from editor/app/build.gradle.kts so
      # the tag always agrees with what the editor APK actually reports.
      - name: Resolve release tag and version name
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          EDIT_VERSION_NAME="$(grep -oP 'versionName = "\K[^"]+' editor/app/build.gradle.kts | tail -n1)"
          if [[ -z "$EDIT_VERSION_NAME" ]]; then
            echo "::error::could not extract versionName from editor/app/build.gradle.kts"
            exit 1
          fi
          if [[ -n "$DISPATCH_TAG" ]]; then
            TAG_NAME="$DISPATCH_TAG"
          else
            TAG_NAME="v${EDIT_VERSION_NAME}-r${GITHUB_RUN_NUMBER}"
          fi
          # The ROUND suffix (the N in "r<N>") drives the APK file name and
          # the release title. It MUST follow the tag, not the run counter:
          # run numbers count every workflow run (CI, releases, re-runs), so
          # a tagged release is not guaranteed to run as run N. When the tag
          # matches the convention, its suffix IS the round; only the
          # computed-default dispatch path falls back to the run number
          # (which is exactly the number that tag embeds).
          if [[ "$TAG_NAME" =~ ^v${EDIT_VERSION_NAME}-r([0-9]+)$ ]]; then
            ROUND="${BASH_REMATCH[1]}"
          else
            ROUND="$GITHUB_RUN_NUMBER"
          fi
          echo "editVersionName=$EDIT_VERSION_NAME  tag=$TAG_NAME  round=$ROUND"
          {
            echo "EDIT_VERSION_NAME=$EDIT_VERSION_NAME"
            echo "TAG_NAME=$TAG_NAME"
            echo "ROUND=$ROUND"
          } >> "$GITHUB_ENV"

      # ADR-0018: the release keystore lives ONLY in GitHub Encrypted Secrets
      # (TG_RELEASE_KEYSTORE_BASE64, set per ADR-0018) --- it is never
      # committed to the repo, so no clone can ever sign releases. The
      # keystore secret reaches this step through a step-level env var
      # (never interpolated into the script body).
      - name: Decode release keystore
        env:
          TG_RELEASE_KEYSTORE_BASE64: ${{ secrets.TG_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$TG_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/toadgallery-release.jks"
          chmod 600 "$RUNNER_TEMP/toadgallery-release.jks"
          if [[ ! -s "$RUNNER_TEMP/toadgallery-release.jks" ]]; then
            echo "::error::decoded keystore is empty --- is TG_RELEASE_KEYSTORE_BASE64 set (ADR-0018)?"
            exit 1
          fi

      # ADR-0018 contract with the release signingConfig in
      # editor/app/build.gradle.kts: the Gradle build reads exactly these
      # four TG_* env vars. The three credential secrets and the keystore
      # path reach the gradle invocation through step-level env --- they
      # never appear in command lines or command logs and never persist
      # beyond the invocation that consumes them (GitHub masks them in logs
      # regardless --- this keeps it clean).
      - name: Build the signed editor release APK
        env:
          TG_KEYSTORE_FILE: ${{ runner.temp }}/toadgallery-release.jks
          TG_KEYSTORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          TG_KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          TG_KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :editor:app:assembleRelease --no-daemon --stacktrace

      # HARD SIGNATURE GATE (ADR-0018) --- the core invariant of this
      # workflow: an unsigned or wrongly signed APK must NEVER be published.
      #   1. assembleRelease must have produced an APK, and it must not be a
      #      *-unsigned.apk (unsigned output means the TG_* signing env
      #      contract above is broken or the secrets are missing).
      #   2. apksigner must verify the APK's signature and print a signer.
      #   3. The signer certificate SHA-256 must equal the pinned release
      #      identity below. A debug key --- or any other keystore --- fails
      #      the job, so what gets published is always signed by THE
      #      toadGALLERY release key.
      - name: Verify the release signature (hard gate)
        run: |
          # Resolve apksigner robustly: the exact pinned build-tools dir
          # first, then a glob fallback in case the runner layout differs.
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/apksigner"
          if [[ ! -x "$APKSIGNER" ]]; then
            APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -path '*36.0.0*/apksigner' -print -quit)"
          fi
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner not found under build-tools 36.0.0"
            exit 1
          fi

          # Pinned release identity (ADR-0018): the toadGALLERY release-key cert.
          EXPECTED_SHA256="8a4640e0732e28b84c2fa35ee7a350d104ce97d87df92262cc8439832bd29494"

          APK_DIR="editor/app/build/outputs/apk/release"
          if [[ ! -d "$APK_DIR" ]]; then
            echo "::error::$APK_DIR does not exist --- assembleRelease produced no output"
            exit 1
          fi
          SIGNED_APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*unsigned*' -print -quit)"
          UNSIGNED_APK="$(find "$APK_DIR" -maxdepth 1 -name '*unsigned*.apk' -print -quit)"
          if [[ -z "$SIGNED_APK" ]]; then
            echo "::error::no signed release APK in $APK_DIR (unsigned present: ${UNSIGNED_APK:-none}) --- the build did not sign; check the TG_* env contract (ADR-0018)"
            exit 1
          fi
          echo "editor release APK: $SIGNED_APK"

          # Non-zero exit from apksigner verify fails the step outright
          # (bash -e): the APK carries no valid signature.
          "$APKSIGNER" verify --print-certs "$SIGNED_APK" > "$RUNNER_TEMP/edit-apk-certs.txt"
          cat "$RUNNER_TEMP/edit-apk-certs.txt"

          ACTUAL_SHA256="$(grep -oP 'Signer #1 certificate SHA-256 digest: \K[0-9a-fA-F]+' "$RUNNER_TEMP/edit-apk-certs.txt" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$ACTUAL_SHA256" ]]; then
            echo "::error::apksigner reported no signer certificate --- signature did not verify"
            exit 1
          fi
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::signer mismatch: expected $EXPECTED_SHA256, got $ACTUAL_SHA256 --- NOT the ADR-0018 release key; refusing to publish"
            exit 1
          fi
          echo "signature gate OK --- signer cert SHA-256 matches the pinned release identity."
          {
            echo "EDIT_APK=$SIGNED_APK"
          } >> "$GITHUB_ENV"

      # The release-stage PERMISSION gate --- aapt2 re-checks the FINAL APK's
      # uses-permission set after signing and before anything is staged or
      # published. The signature gate covers identity; this gate covers the
      # privacy surface at the point of no return. The rule is "no UNEXPECTED
      # permissions": every uses-permission the APK carries must be in its
      # allowlist or the run fails and nothing is published. (The reverse is
      # deliberately NOT asserted --- a missing allowlisted entry only breaks
      # a feature; an extra one is a privacy regression.)
      # The allowlist is derived from the source manifests plus the
      # documented library merges; docs/phase-11/permissions-and-privacy.md
      # is the record:
      #   - the editor's only REQUESTED permission is its own pre-Q capped
      #     WRITE_EXTERNAL_STORAGE; the merged APK additionally carries the
      #     documented library merges (media3: WAKE_LOCK +
      #     ACCESS_NETWORK_STATE + the legacy uncapped READ_EXTERNAL_STORAGE)
      #     and androidx.core's per-app dynamic receiver guard
      #     (com.toadgallery.editor.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION).
      # aapt2 is resolved exactly like the signature gate's apksigner: the
      # pinned build-tools dir first, glob fallback if the runner layout
      # differs. The found set is printed for auditability.
      - name: Verify the release APK's permission set (uses-permission gate)
        run: |
          AAPT2="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt2"
          if [[ ! -x "$AAPT2" ]]; then
            AAPT2="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 | sort -V | tail -1)"
          fi
          if [[ -z "$AAPT2" || ! -x "$AAPT2" ]]; then
            echo "::error::aapt2 not found under build-tools 36.0.0"
            exit 1
          fi

          LABEL="edit"
          APK="$EDIT_APK"
          ALLOWED="android.permission.INTERNET android.permission.WRITE_EXTERNAL_STORAGE android.permission.READ_EXTERNAL_STORAGE android.permission.ACCESS_NETWORK_STATE android.permission.WAKE_LOCK com.toadgallery.editor.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          FOUND="$("$AAPT2" dump badging "$APK" | sed -n "s/^uses-permission[^:]*: name='\([^']*\)'.*$/\1/p")"
          echo "== $LABEL: $APK"
          if [[ -n "$FOUND" ]]; then
            printf '%s\n' "$FOUND" | sed 's/^/   uses-permission: /'
          else
            echo "   (aapt2 reported no uses-permission lines)"
          fi
          UNEXPECTED=0
          while IFS= read -r name; do
            if [[ -n "$name" ]]; then
              case " $ALLOWED " in
                *" $name "*)
                  ;;
                *)
                  echo "::error::$LABEL: unexpected uses-permission '$name' --- not in the manifest-derived allowlist; refusing to publish"
                  UNEXPECTED=1
                  ;;
              esac
            fi
          done <<< "$FOUND"

          if [[ "$UNEXPECTED" != 0 ]]; then
            echo "::error::permission gate FAILED --- the release APK carries a uses-permission outside its manifest-derived allowlist; nothing is published"
            exit 1
          fi
          echo "permission gate OK --- the release APK's uses-permission set is within its allowlist."

      # Publishable set: the renamed APK with its sha256 checksum and the
      # clearly-named R8 mapping.txt --- every release build is minified, so
      # the mapping is needed for crash symbolication.
      - name: Stage release artifacts
        run: |
          mkdir -p "$RELEASE_STAGE"
          EDIT_APK_NAME="toadGALLERY-edit-${EDIT_VERSION_NAME}-r${ROUND}.apk"
          cp "$EDIT_APK" "$RELEASE_STAGE/$EDIT_APK_NAME"
          ( cd "$RELEASE_STAGE" && sha256sum "$EDIT_APK_NAME" > "$EDIT_APK_NAME.sha256" )
          if [[ -f editor/app/build/outputs/mapping/release/mapping.txt ]]; then
            cp editor/app/build/outputs/mapping/release/mapping.txt "$RELEASE_STAGE/toadGALLERY-edit-${EDIT_VERSION_NAME}-r${ROUND}-mapping.txt"
          else
            echo "::warning::no edit R8 mapping at editor/app/build/outputs/mapping/release/mapping.txt"
          fi
          ls -l "$RELEASE_STAGE"
          cat "$RELEASE_STAGE"/*.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-apks
          path: ${{ env.RELEASE_STAGE }}
          if-no-files-found: warn
          retention-days: 30

      # softprops/action-gh-release creates the tag at the current SHA when it
      # does not exist yet --- that is what makes the dispatch path work: the
      # computed default tag (e.g. v0.4.14-edit-alpha-r72) never exists in git
      # before the run. prerelease + make_latest: false keep these testing
      # builds clearly separate from any future stable release (they never
      # show up as "Latest"; the v1.0 cut is a human decision per ADR-0018,
      # never a workflow default). SHA-pinned: this step holds the job's
      # contents: write scope, so a moved/compromised upstream tag can no
      # longer execute here.
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: toadGALLERY Edit ${{ env.EDIT_VERSION_NAME }} — the pre-release (r${{ env.ROUND }})
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_STAGE }}/*
          body: |
            **TESTING pre-release --- toadGALLERY Edit r${{ env.ROUND }}.** Not a
            stable release; the device-verification matrix stays human-only
            (see `docs/phase-11/known-limitations.md`).

            - `toadGALLERY-edit-<version>.apk` --- **the editor.**
              Crop/rotate/perspective, adjustments, LUT filters, text,
              stickers, drawing, mosaic/blur, frames, magic erase, sky
              replacement, bokeh, opt-in face retouch, and the lightweight
              video editor (trim/mute/slow-mo/frame extraction/GIF/WebP).

            - Requires Android 8.0+ (minSdk 26). The APK is signed with the
              toadGALLERY release key (ADR-0018), so updates install in
              place over previous toadGALLERY Edit pre-releases.
            - Verify your download: `sha256sum -c toadGALLERY-edit-*.apk.sha256`
              and/or `apksigner verify --print-certs <apk>` --- the signer
              certificate SHA-256 must be
              `8a4640e0732e28b84c2fa35ee7a350d104ce97d87df92262cc8439832bd29494`
              (CI pins this digest before anything is published; an unsigned
              or debug-signed build can never reach this page).
            - The `*-mapping.txt` file is the R8 mapping for crash
              de-obfuscation, kept per release so traces from testing
              devices can always be symbolicated.
            - Built from commit `${{ github.sha }}`. Reproducibility: the
              Reproducible workflow run on this tag.
