name: Screenshots (Roborazzi)

# Phase 11 screenshot testing (docs/phase-11/roborazzi.md), editor module.
#
# The Roborazzi gradle plugin (io.github.takahirom.roborazzi 1.77.0) is
# applied to editor/core, so this workflow drives the plugin's task pair:
#
# - record mode (workflow_dispatch with mode=record): runs
#   recordRoborazziDebug, which runs the capture tests with
#   roborazzi.test.record=true and writes the PNGs into the plugin's
#   configured output dir --- editor/core/src/test/resources/roborazzi (the
#   committed-baseline location; the build-dir default can never hold
#   committed goldens). The artifact IS the baseline source for F-34.
# - verify mode (the default): runs verifyRoborazziDebug, which re-renders
#   the state cards and FAILS on a pixel diff against the committed
#   baselines. Resilient-but-honest until baselines exist: a repo-file
#   existence check counts committed PNGs under
#   editor/core/src/test/resources/roborazzi; with ZERO committed baselines
#   the verify step is SKIPPED (an explicit conditional step with a loud log
#   and a job summary --- NOT continue-on-error) and a record run still
#   happens so the artifact stays available as the baseline source. The
#   moment PNGs are committed at that path, the same job starts gating.
#
# A PLAIN unit-test run does NOT record anymore: with the plugin applied,
# captureRoboImage() is skipped unless a roborazzi task is in the graph
# (roborazzi.test.record=false).
#
# MANUAL-DISPATCH ONLY: the record-first loop it imposed on every PR ---
# re-record passes, pixel-drift chases, fixture churn per restyle --- taxes
# the build pace more than it pays. The PR gates that carry the work are
# the CI lanes --- lint debug, assemble, and the unit-test suites
# (ci.yml, editor-ci.yml). The plugin wiring and the baselines survive, so
# re-arming the PR gate is a small revert.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "record = capture fresh baselines (the F-34 source artifact); verify = gate against committed baselines"
        required: false
        default: verify
        type: choice
        options:
          - verify
          - record

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- The editor chassis suite ---------------------------------------------
  # The plugin wiring (editor/core/build.gradle.kts), the committed-baseline
  # location (editor/core/src/test/resources/roborazzi) and the honesty
  # halves: record until baselines are committed, then the verify task
  # becomes the drift gate. No flavors on this module, so the task pair is
  # recordRoborazziDebug / verifyRoborazziDebug.
  edit-chassis:
    name: Record / verify edit-app chassis screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The canonical toolchain setup (.github/actions/toad-setup): the
      # pure-Android shape (JDK 17 + SDK platform 36/build-tools 36 + the
      # Gradle cache + gradlew chmod; no Rust --- the screenshot tests are a
      # pure JVM/Robolectric surface).
      - name: Set up the toolchain (Android)
        uses: ./.github/actions/toad-setup

      # The gate's honesty hinge: count the COMMITTED baselines (git ls-files,
      # not the filesystem --- the working tree must match the repo, and a
      # fresh checkout's filesystem equals HEAD anyway). Roborazzi 1.77.0
      # writes flat fully-qualified-name PNGs under the configured output dir.
      - name: Detect committed baselines
        id: baselines
        run: |
          count=$(git ls-files 'editor/core/src/test/resources/roborazzi/*.png' | wc -l)
          echo "Committed Roborazzi baselines (edit): ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Record edit-app chassis screenshots
        if: >
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'record')
          || steps.baselines.outputs.count == 0
        run: ./gradlew :editor:core:recordRoborazziDebug --stacktrace --no-daemon

      - name: Verify edit-app chassis screenshots (the drift gate)
        if: >
          !(github.event_name == 'workflow_dispatch' && inputs.mode == 'record')
          && steps.baselines.outputs.count > 0
        run: ./gradlew :editor:core:verifyRoborazziDebug --stacktrace --no-daemon

      - name: Verify skipped --- no committed baselines yet
        if: >
          !(github.event_name == 'workflow_dispatch' && inputs.mode == 'record')
          && steps.baselines.outputs.count == 0
        run: |
          {
            echo "### Edit-app Roborazzi verify skipped --- baselines not committed yet"
            echo ""
            echo "No PNGs exist under \`editor/core/src/test/resources/roborazzi/\`"
            echo "in this ref, so verifyRoborazziDebug has nothing to compare"
            echo "against. The screenshots are still documentation (this run's"
            echo "artifact is the baseline source), not a drift gate."
            echo ""
            echo "**Follow-up:** download the edit-chassis-baselines artifact"
            echo "from a green record run, unzip it at the repo root so the PNGs"
            echo "land at editor/core/src/test/resources/roborazzi/, and commit"
            echo "them. The verify gate then activates on the next run."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Edit-app Roborazzi verify skipped: 0 committed baselines under editor/core/src/test/resources/roborazzi --- record + commit the artifact's PNGs to activate the gate."

      # The artifact covers the plugin-configured committed-baseline dir
      # (record mode) and the plugin's diff/compare outputs (verify mode
      # writes _actual/_compare siblings on drift). if-no-files-found stays
      # at the default 'warn' (never 'error'): an empty capture set must not
      # mask the outcome of the gradle step itself.
      - name: Upload edit screenshots artifact (the baseline source)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: edit-chassis-baselines
          path: |
            editor/core/src/test/resources/roborazzi/**
            editor/core/build/outputs/roborazzi/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload edit test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: edit-chassis-test-reports
          path: editor/core/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
