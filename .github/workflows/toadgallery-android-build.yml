name: ToadGallery Android Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK (split per ABI)
        working-directory: mobile/apps/toadgallery
        run: flutter build apk --release --split-per-abi

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toadgallery-android-apks
          path: mobile/apps/toadgallery/build/app/outputs/flutter-apk/*.apk
