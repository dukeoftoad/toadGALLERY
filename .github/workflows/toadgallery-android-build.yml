name: ToadGallery Android Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Drop untranslated-messages-file guard for CI l10n
        run: sed -i '/^untranslated-messages-file:/d' mobile/packages/strings/l10n.yaml

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate FRB bindings
        working-directory: rust
        run: cargo codegen frb photos

      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet

      - name: Decode Android signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"
          echo "SIGNING_KEY_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (universal, arm + arm64)
        working-directory: mobile/apps/toadgallery
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: flutter build apk --release --flavor independent --target-platform android-arm,android-arm64

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toadgallery-android-apks
          path: mobile/apps/toadgallery/build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          generate_release_notes: true
          files: mobile/apps/toadgallery/build/app/outputs/flutter-apk/*.apk
