name: ToadGallery CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Drop untranslated-messages-file guard for CI l10n
        run: >-
          sed -i.bak '/^untranslated-messages-file:/d' mobile/packages/strings/l10n.yaml
          && rm -f mobile/packages/strings/l10n.yaml.bak

      - name: Install Dart/Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate FRB bindings
        working-directory: rust
        run: cargo codegen frb photos

      - name: Run Flutter analyze
        working-directory: mobile/apps/toadgallery
        run: flutter analyze

      - name: Build Rust library for tests
        working-directory: rust
        run: cargo build -p ente-photos-frb --features flutter

      - name: Run Flutter unit tests
        working-directory: mobile/apps/toadgallery
        env:
          ENTE_PHOTOS_FRB_LIBRARY: ${{ github.workspace }}/rust/target/debug/libente_photos_frb.so
        run: flutter test

  rust-check:
    name: Rust Bindings Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Check photos FRB crate
        working-directory: rust
        run: cargo check -p ente-photos-frb
