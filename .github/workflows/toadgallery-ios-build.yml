name: ToadGallery iOS Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS (No Codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Drop untranslated-messages-file guard for CI l10n
        run: sed -i '/^untranslated-messages-file:/d' mobile/packages/strings/l10n.yaml

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate FRB bindings
        working-directory: rust
        run: cargo codegen frb photos

      - name: Build iOS release (unsigned)
        working-directory: mobile/apps/toadgallery
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Runner.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: toadgallery-ios-app
          path: mobile/apps/toadgallery/build/ios/iphoneos/Runner.app
