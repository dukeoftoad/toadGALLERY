# toadGALLERY engine cargo configuration.
#
# The [env] entry and the Android/aarch64 rustflags sections below are carried
# over VERBATIM from upstream Ente's `rust/.cargo/config.toml` at the pinned
# commit 423b2d80d9ec89d45f5680cb1e1d777bac225f41 (r22; see NOTICE.md).
# Upstream's `[alias]` section (a `codegen` alias for a crate that is not part
# of this workspace) is deliberately not carried over. These settings only
# affect Android/AArch64 cross-builds; the host-target CI gates
# (`cargo check --workspace --all-targets`, `cargo fmt --all -- --check`,
# `cargo clippy --workspace`) are unaffected.

[env]
# Some targets, like armv7 Android, have no enabled target features, so Cargo
# otherwise omits CARGO_CFG_TARGET_FEATURE. llama-cpp-sys-2 expects it to exist.
CARGO_CFG_TARGET_FEATURE = ""

[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "chacha20_force_neon"]

# Android 16 KB page-size support (required by Play Store from mid-2025).
# Every shared library must be linked with max-page-size=16384.
[target.aarch64-linux-android]
rustflags = ["--cfg", "chacha20_force_neon", "-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
