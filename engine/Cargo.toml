# toadGALLERY vendored engine workspace.
#
# Provenance: extracted from Ente's monorepo rust/ workspace at pinned commit
# 423b2d80d9ec89d45f5680cb1e1d777bac225f41 (see NOTICE.md and
# docs/phase-5/ente-pin.md). Only the workspace.dependencies entries needed by
# the three vendored crates were carried over, verbatim from upstream.
[workspace]
resolver = "2"
members = [
    "crates/ente-assets",
    "crates/ente-image",
    "crates/ente-ml",
    "crates/toad-ml-jni",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
ente-assets = { path = "crates/ente-assets" }
ente-image = { path = "crates/ente-image" }
ente-ml = { path = "crates/ente-ml" }
anyhow = "1.0.104"
fast_image_resize = { version = "6.1.0", features = ["image"] }
flate2 = "1.1.10"
futures-util = "0.3.32"
image = "0.25.10"
jni = "0.21.1"
log = "0.4.34"
moxcms = "0.9.1"
ort = { version = "=2.0.0-rc.15", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.1"
url = "2.5.8"

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(frb_expand)'] }
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
empty_drop = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
manual_let_else = "deny"
needless_collect = "deny"
path_buf_push_overwrite = "deny"
rc_mutex = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
suspicious_operation_groupings = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unused_async = "deny"
unused_peekable = "deny"
unused_rounding = "deny"
unwrap_used = "deny"

# Upstream: unoptimized ML inference dominates test runtime.
[profile.dev.package.ente-ml]
opt-level = 3
