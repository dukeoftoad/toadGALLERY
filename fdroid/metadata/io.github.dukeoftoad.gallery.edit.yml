MaintainerNotes: |-
    build environment: the canonical recipe is the CI one (ADR-0013) --- JDK 17
    (temurin) + Android SDK platform 36 + build-tools 36.0.0 + the gradle
    wrapper (pinned in gradle/wrapper/gradle-wrapper.properties), which is
    exactly what .github/actions/toad-setup installs in ci.yml/release.yml;
    no sudo field is needed for this package (the editor has no native-code
    surface of its own).

    output name: the release output of the :editor:app module under
    editor/app/build/outputs/apk/release/ (the release build is unsigned
    when no signing config is wired --- release.yml keeps release signing in
    CI only per ADR-0018); the '*-unsigned.apk' glob matches the real name.

    reproducibility: the repo's reproducible-build workflow double-builds
    the unsigned release APK on every v* tag push and compares it
    (byte-level with a content-level fallback) --- see
    docs/phase-11/reproducible-builds.md. F-Droid builds unsigned from
    source; the pinned signing key only governs the project's own GitHub
    pre-releases (ADR-0018 --- F-Droid builds its own binaries and re-signs
    them), which is why Binaries is empty.

    AntiFeatures is empty because the app has none by construction: no ads,
    no tracking, no analytics. Network access is limited to the on-demand
    AI model downloads from a single pinned host (sha256-pinned by the
    app's own EditAiManifestTest, so a swapped model fails the build).

    versioning conventions: the edit versionCode bumps once per release
    round and is independent of any other package's; each Build entry is
    curated by hand (AutoUpdateMode stays None), pinned to the release tag
    it was cut in.

AutoUpdateMode: None
UpdateCheckMode: Tags v([0-9.]+-alpha)-r[0-9]+
CurrentVersion: 0.4.11-edit-alpha
