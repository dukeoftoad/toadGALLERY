#
# Prepared for submission to fdroiddata as a new-app merge request (the
# conventions are recorded in MaintainerNotes below and in
# docs/phase-11/fdroid-metadata.md, the submission-package doc).
Categories:
  - Multimedia
License: GPL-3.0
SourceCode: https://github.com/dukeoftoad/toadGALLERY
IssueTracker: https://github.com/dukeoftoad/toadGALLERY/issues
Changelog: https://github.com/dukeoftoad/toadGALLERY/releases

AutoName: toadGALLERY Edit
Summary: The offline, non-destructive photo and video editor
Description: |-
    toadGALLERY Edit is a single, private, offline-first photo and video
    editor for Android. It works standalone on its own and also integrates
    with toadGALLERY through a versioned content-URI contract.

    The photo editor: crop, rotate, straighten and perspective; a full
    adjustment suite (tone, saturation, temperature/tint, HSL bands,
    vignette, sharpen); LUT filters plus user .cube LUT import; text,
    stickers and freehand drawing; mosaic/blur regions; parametric frames;
    and the on-device AI features --- magic erase, sky replacement, bokeh
    and opt-in face retouch.

    The AI features run entirely on-device through ONNX Runtime. The ONNX
    models are NOT bundled in the APK; they are downloaded on demand from
    a single pinned host when the corresponding feature is first used.
    Their SHA-256 digests are pinned by the app's own manifest test, so a
    swapped model fails the build.

    The lightweight video editor: trim, mute, slow-motion, frame
    extraction, and GIF/WebP animated export (built on media3).

    Everything is non-destructive by construction: each edit is recorded as
    a replayable recipe, the originals are never modified, and exports go
    through MediaStore INSERT-only writes (there is no replace-original
    path at all).

    The app requests no permissions beyond the legacy external-storage
    write grant its export path needs (pre-Android 10 only).

    Licensed GPL-3.0; the full source for every release is published on
    GitHub and every release links the exact commit it was built from.

RequiresRoot: false

RepoType: git
Repo: https://github.com/dukeoftoad/toadGALLERY.git

# The GitHub pre-releases are release-SIGNED APKs (ADR-0018) and signed-APK
# determinism is not claimed; the unsigned artifact built from source is the
# comparison target.
Binaries: []

AntiFeatures: []

Builds:
