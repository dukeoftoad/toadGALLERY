# toadGALLERY build environment
# Memory sizing verified in the Phase 0 baseline environment (docs/phase-0/build-notes.md);
# bumped in the r10 round: KSP + the Room schema compiler joined the single-use
# daemon JVM (kotlin.compiler.execution.strategy=in-process) on top of R8 and
# lintVital, and the Phase-0 envelope (-Xmx1792m / MaxMetaspaceSize=384m) ran
# out of Metaspace on CI --- lintVitalAnalyzeRelease and minifyReleaseWithR8
# both failed and the job hung into its 30-minute timeout. Verified locally
# with these exact caps: full release build + R8 + lintVital green.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
