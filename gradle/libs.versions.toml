[versions]
kotlin = "2.3.10"
gradlePlugins-agp = "9.2.1"
# AndroidX
androidx-activity-compose = "1.10.1"
androidx-navigation-compose = "2.8.5"
androidx-exifinterface = "1.4.1"
# Paging 3: incremental timeline (issue #28)
androidx-paging = "3.3.2"
# Lifecycle (ViewModel + runtime-compose) for Phase 3 state holders
androidx-lifecycle = "2.8.7"
# BiometricPrompt for the vault's biometric unlock binding (issue #57,
# ADR-0019): declares USE_BIOMETRIC but NOT INTERNET, so the ADR-0014
# offline gate is unaffected
androidx-biometric = "1.1.0"
# WorkManager for the r24 background face-index queue (Workstream 5 of
# docs/phase-4/phase-4-contract-audit-and-ente-ai-plan.md): persistence of
# the queue across process death, retry/backoff and progress plumbing for
# the Settings dogfood card. Pure on-device scheduling --- no network code;
# its manifest injects WAKE_LOCK + RECEIVE_BOOT_COMPLETED into the MERGED
# manifest (documented in docs/phase-2/privacy-gate.md, r24 note; the
# source manifest's pinned permission set is unchanged and still guarded
# by the PrivacyPolicyTest pin).
androidx-work = "2.10.1"
# Material (Theme.Material3.DayNight.NoActionBar manifest theme)
material = "1.13.0"
# Jetpack Compose (ADR-0009) --- BOM-pinned
compose-bom = "2024.12.01"
# Compose-first image loader (per compose-migration.md)
coil-compose = "2.7.0"
# In-app video playback for the viewer (issue #50; roadmap L608 sanctions media3)
media3 = "1.11.1"
# Room: the ADR-0006 persistence layer for the Phase 4 media catalogue
# (Phase 4 audit, "Database" row: "land Room catalogue; keep Ente ML
# DB/vector store as separate engine-owned stores"). Room holds ONLY media
# identity, revision, metadata-cache state and scan checkpoints --- face/CLIP
# vectors and every other AI output stay in the engine-owned ML stores, so
# this dependency must never grow into a vector store. Verified against the
# Google mirror at integration: the 2.7.x line stops at 2.7.2 and 2.7.6 was
# never published; 2.8.5 is the current 2.8.x release (compileSdk 36 pin
# already satisfies it).
androidx-room = "2.8.5"
# KSP drives the Room compiler (KSP, not kapt --- the project has no kapt
# plugin and AGP 9's built-in Kotlin pairs with KSP). Verified against the
# plugin portal at integration: KSP2 dropped the "<kotlin>-<ksp>" pair
# versioning from 2.3.0 onwards --- releases are now bare "2.3.x" numbers
# tracking the compiler they are built against (the legacy pair releases
# such as 2.2.21-2.0.5 remain for pre-2.3 compilers). 2.3.10 exists for our
# catalog Kotlin 2.3.10; 2.3.13 is the newest line.
ksp = "2.3.10"
# Testing (issue #20 privacy suite)
junit = "4.13.2"
# The real org.json implementation for JVM unit tests: android.jar ships a
# stub whose methods throw "not mocked"; the facade's r23 cluster-summary
# parser (and its malformed-shape tests) exercise the real parser on the JVM.
# Test classpath ONLY --- the release APK still ships the platform org.json,
# zero new runtime surface (ADR-0014 unaffected).
org-json = "20240303"
androidx-test-runner = "1.6.2"
androidx-test-rules = "1.6.1"
androidx-test-ext-junit = "1.2.1"
# build
app-build-compileSDKVersion = "36"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
# BiometricPrompt + auth-bound Keystore CryptoObject for the vault (issue #57,
# ADR-0019): pure on-device auth library, no network code --- it declares
# USE_BIOMETRIC but NOT INTERNET, so the ADR-0014 merged-manifest gate holds
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
# WorkManager (r24): the background face-index queue's scheduling +
# process-death persistence (Workstream 5)
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
# Paging 3 (issue #28): windowed MediaStore loads + LazyPagingItems grid
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "androidx-paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "androidx-paging" }
# Privacy instrumented suite (issue #20): GrantPermissionRule for the Phase 3 media-permission pre-grant
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
material = { module = "com.google.android.material:material", version.ref = "material" }
# Compose BOM keeps all compose-* artifacts on a coordinated version (ADR-0009)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
# Back-arrow icon for the album detail top bar (BOM-pinned, issue #29)
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil-compose" }
# Video frame decoding for thumbnails (issue #33)
coil-video = { module = "io.coil-kt:coil-video", version.ref = "coil-compose" }
# Animated GIF decoding for the full-screen viewer (issue #50 follow-up)
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil-compose" }
# In-app video playback for the full-screen viewer (issue #50): local content
# URIs only --- media3 declares no INTERNET permission, the ADR-0014 gate holds
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
# Phase 4 media catalogue (ADR-0006): Room runtime + suspend-DAO coroutine
# support (room-ktx); the schema compiler runs through the KSP plugin (see
# [plugins]). Pure on-device storage --- Room declares no INTERNET permission,
# so the ADR-0014 merged-manifest privacy gate is unaffected.
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
# NOTE: org.fossify:commons removed per ADR-0008 (no upstream code ports).
# Testing (issue #20 privacy suite) --- compose test artifacts via compose-bom
junit = { module = "junit:junit", version.ref = "junit" }
# The real org.json for JVM unit tests only (see the version note above).
org-json = { module = "org.json:json", version.ref = "org-json" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Compose compiler plugin ships with Kotlin 2.0+ (ADR-0009)
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# KSP for the Room compiler (Phase 4 media catalogue): annotation processing
# without kapt. Declared here and applied in apps/gallery alongside the
# room-compiler artifact.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

