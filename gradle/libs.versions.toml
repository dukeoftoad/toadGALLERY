[versions]
kotlin = "2.3.10"
gradlePlugins-agp = "9.2.1"
# AndroidX
androidx-activity-compose = "1.10.1"
androidx-navigation-compose = "2.8.5"
androidx-exifinterface = "1.4.1"
# Material (Theme.Material3.DayNight.NoActionBar manifest theme)
material = "1.13.0"
# Jetpack Compose (ADR-0009) --- BOM-pinned
compose-bom = "2024.12.01"
# Compose-first image loader (per compose-migration.md)
coil-compose = "2.7.0"
# Testing (issue #20 privacy suite)
junit = "4.13.2"
androidx-test-runner = "1.6.2"
androidx-test-ext-junit = "1.2.1"
# build
app-build-compileSDKVersion = "36"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
material = { module = "com.google.android.material:material", version.ref = "material" }
# Compose BOM keeps all compose-* artifacts on a coordinated version (ADR-0009)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil-compose" }
# NOTE: org.fossify:commons removed per ADR-0008 (no upstream code ports).
# Testing (issue #20 privacy suite) --- compose test artifacts via compose-bom
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Compose compiler plugin ships with Kotlin 2.0+ (ADR-0009)
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

