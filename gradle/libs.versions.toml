[versions]
kotlin = "2.3.10"
gradlePlugins-agp = "9.2.1"
# AndroidX
androidx-activity-compose = "1.10.1"
androidx-navigation-compose = "2.8.5"
androidx-exifinterface = "1.4.1"
# Paging 3: incremental timeline
androidx-paging = "3.3.2"
# Lifecycle (ViewModel + runtime-compose) state holders
androidx-lifecycle = "2.8.7"
# BiometricPrompt for the vault: declares USE_BIOMETRIC but NOT INTERNET, so the
# offline merged-manifest gate is unaffected
androidx-biometric = "1.1.0"
# WorkManager: background face-index queue, process-death persistence, pure on-device
androidx-work = "2.10.1"
# Material (manifest theme)
material = "1.13.0"
# Jetpack Compose, BOM-pinned
compose-bom = "2024.12.01"
# Compose-first image loader
coil-compose = "2.7.0"
# media3: viewer playback + editor export; declares no permissions, so the editor
# INTERNET gate stays green with it aboard
media3 = "1.11.1"
# Room: media catalogue persistence ONLY (identity, metadata cache, scan checkpoints);
# AI vectors stay in engine-owned stores. 2.8.5 is the current 2.8.x line.
androidx-room = "2.8.5"
# KSP drives the Room compiler; bare 2.3.x releases track the compiler from 2.3.0 on
ksp = "2.3.10"
# Testing
junit = "4.13.2"
# ONNX Runtime: prebuilt Android AAR, NNAPI-first with CPU fallback; declares no
# INTERNET permission
onnxruntime-android = "1.31.1"
# Real org.json for JVM unit tests only: android.jar ships a throwing stub
org-json = "20240303"
androidx-test-runner = "1.6.2"
androidx-test-rules = "1.6.1"
androidx-test-ext-junit = "1.2.1"
# Robolectric renders the real Compose UI on the JVM; Roborazzi records/verifies PNGs.
# 1.77.0 pairs with robolectric 4.17; tests pin sdk 34
robolectric = "4.17"
roborazzi = "1.77.0"
# build
app-build-compileSDKVersion = "36"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
# Vault biometric unlock, auth-bound Keystore CryptoObject
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
# Background face-index queue scheduling
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
# Windowed MediaStore loads
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "androidx-paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "androidx-paging" }
# Instrumented privacy suite (GrantPermissionRule)
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
material = { module = "com.google.android.material:material", version.ref = "material" }
# Compose BOM keeps all compose-* artifacts on a coordinated version
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
# Material icon set, BOM-pinned
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil-compose" }
# Video frame decoding for thumbnails
coil-video = { module = "io.coil-kt:coil-video", version.ref = "coil-compose" }
# Animated GIF decoding for the viewer
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil-compose" }
# Viewer video playback (local content URIs only)
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
# Video editor export pipeline (Transformer + GL effect surface)
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
# Room catalogue (runtime + ktx; compiler via KSP)
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
# Testing
junit = { module = "junit:junit", version.ref = "junit" }
# Editor's on-device AI runtime
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime-android" }
# Real org.json for JVM unit tests only
org-json = { module = "org.json:json", version.ref = "org-json" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# Screenshot testing, JVM unit-test classpath only (zero runtime APK surface)
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
# Library flavor of the same AGP pin
android-library = { id = "com.android.library", version.ref = "gradlePlugins-agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Compose compiler plugin ships with Kotlin 2.0+
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Pure-JVM Kotlin library modules (same toolchain as the Compose plugin)
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# KSP for the Room compiler (annotation processing without kapt)
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Roborazzi screenshot-test task wiring; plain unit-test runs skip captures
# (recording is the recordRoborazzi* task's job)
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
